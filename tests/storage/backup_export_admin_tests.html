<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests protection export sauvegardes</title><body>
<pre id="result">Tests en cours…</pre><iframe id="appFrame" src="../../index.html" style="position:absolute;left:-10000px;width:1280px;height:900px"></iframe>
<script>
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
document.querySelector("#appFrame").addEventListener("load",async()=>{const frame=document.querySelector("#appFrame"),w=frame.contentWindow,d=frame.contentDocument,lines=[];let passed=0,exports=0;const test=(name,value)=>{lines.push(`${value?"PASS":"FAIL"} ${name}`);if(value)passed++;};d.querySelector("#nameInput").value="Test";d.querySelector("#loginForm").requestSubmit();await wait(2500);d.querySelector('[data-view="backups"]').click();await wait(800);w.ExadexGithubStorage.loadBackup=async()=>({snapshot:{inventoryItems:[]}});w.ExadexBackupExport.exportExcel=async()=>{exports++;return{filename:"test.xlsx"}};w.ExadexBackupExport.exportJson=async()=>{exports++;return{filename:"test.json"}};const exportButton=d.querySelector('[data-export-backup="xlsx"]');exportButton.click();test("demande du code administrateur",d.querySelector("#exportBackupDialog").open);d.querySelector("#exportBackupPassword").value="incorrect";d.querySelector("#exportBackupForm").requestSubmit();await wait(50);test("code incorrect bloque l'export",exports===0&&!d.querySelector("#exportBackupError").classList.contains("hidden"));d.querySelector("#exportBackupPassword").value="645443";d.querySelector("#exportBackupForm").requestSubmit();await wait(100);test("code correct autorise l'export Excel",exports===1&&!d.querySelector("#exportBackupDialog").open);d.querySelector('[data-export-backup="json"]').click();d.querySelector("#exportBackupPassword").value="645443";d.querySelector("#exportBackupForm").requestSubmit();await wait(100);test("export JSON également protégé",exports===2&&!d.querySelector("#exportBackupDialog").open);test("avertissement navigateur près de la copie complète",d.querySelector(".backup-local-scope-note")?.textContent.includes("propre à ce navigateur"));d.querySelector('[data-view="agents"]').click();await wait(100);test("avertissement local dans Audit",d.querySelector(".agent-local-scope-note")?.textContent.includes("uniquement dans ce navigateur"));const agentButtons=[...d.querySelectorAll(".agent-card > button")];test("boutons des deux cartes alignés",agentButtons.length===2&&Math.abs(agentButtons[0].getBoundingClientRect().top-agentButtons[1].getBoundingClientRect().top)<1);document.querySelector("#result").textContent=lines.join("\n")+`\n${passed}/7 tests passed`;document.title=passed===7?"PASS":"FAIL";document.body.dataset.failed=String(passed!==7);w.stop();});
</script></body></html>
