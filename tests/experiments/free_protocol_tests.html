<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests protocole libre</title><link rel="stylesheet" href="../../assets/css/design.css"><body><pre id="result">Tests en cours…</pre><iframe id="appFrame" hidden></iframe><script>
const rows=[];let passed=0;const assert=(v,m)=>{if(!v)throw Error(m)},test=(n,f)=>{try{f();rows.push(`✓ ${n}`);passed++}catch(e){rows.push(`✗ ${n}: ${e.message}`)}};
document.querySelector("#appFrame").addEventListener("load",()=>{const app=document.querySelector("#appFrame").contentWindow,d=app.document,S=app.StockTracking,bottle={id:"fixture-bottle",name:"DMEM low glucose",quantity:0,unit:"bouteilles",stockTracking:{mode:"containers",packagingLevels:[{key:"bouteille",singular:"bouteille",plural:"bouteilles",kind:"discrete",contains:1},{key:"mL",singular:"mL",plural:"mL",kind:"continuous",contains:1000},{key:"µL",singular:"µL",plural:"µL",kind:"continuous",contains:1000}],trackingUnitKey:"µL",closedByLocation:[{location:"R",quantity:1}],openContainers:[{id:"done",remaining:0,capacity:1000000,status:"finished"}]},aliquotTracking:{enabled:false,preparations:[]}},empty={...bottle,id:"empty",stockTracking:{...bottle.stockTracking,closedByLocation:[]}},before=JSON.stringify({items:app.items,experiments:app.applicationExperiments});
app.renderTemplateOptions();const select=d.querySelector("#experimentTemplate");test("01 Nouveau protocole premier",()=>assert(select.options[0].textContent==="Nouveau protocole","ordre"));app.openExperimentModal();test("02 sélection par défaut",()=>assert(select.value==="custom-protocol","défaut"));test("03 templates conservés",()=>assert([...select.options].some(o=>o.textContent.includes("Extraction"))&&[...select.options].some(o=>o.textContent.includes("RT-qPCR")),"templates"));test("04 Template Notes masqué",()=>assert(d.querySelector("#experimentTemplateNotesField").classList.contains("hidden"),"visible"));test("05 notes expérience visibles",()=>assert(!d.querySelector("#experimentNotes").closest("label").classList.contains("hidden"),"notes masquées"));test("06 items vides",()=>assert(!d.querySelector("#experimentItemsList").children.length,"lignes"));test("07 aucun ancien item",()=>assert(!d.querySelector("#experimentItemsList").textContent.trim(),"héritage"));d.querySelector("#addExperimentInventoryItemBtn").click();let inventoryRow=d.querySelector('[data-line-type="inventory"]');test("08 ligne inventaire vide",()=>assert(inventoryRow&&!inventoryRow.querySelector(".experiment-item-select").value&&!inventoryRow.querySelector(".experiment-item-quantity").value,"ligne"));d.querySelector("#addExperimentCustomItemBtn").click();let customRow=d.querySelector('[data-line-type="custom"]');test("09 ligne libre typée",()=>assert(customRow.dataset.lineType==="custom","type"));test("10 identifiants stables",()=>assert([...inventoryRow.querySelectorAll("option[value]")].filter(o=>o.value).every(o=>app.items.some(i=>i.id===o.value)),"ids"));const units=app.getExperimentItemUnits(bottle);test("11 plus petite unité par défaut",()=>assert(units[0].key==="µL","petite"));test("12 unités supérieures proposées",()=>assert(units.map(u=>u.key).join(",")==="µL,mL,bouteille",JSON.stringify(units)));const incompatible={...bottle,stockTracking:{...bottle.stockTracking,packagingLevels:[...bottle.stockTracking.packagingLevels.slice(0,2),{key:"mg",singular:"mg",plural:"mg",kind:"continuous",contains:2}]}};test("13 incompatible exclue",()=>assert(!app.getExperimentItemUnits(incompatible).some(u=>u.key==="mg"),"mg"));test("14 quantité vide neutre",()=>assert(app.getExperimentItemAvailability(bottle,NaN,"µL").kind==="neutral","état"));test("15 stock suffisant vert",()=>assert(app.getExperimentItemAvailability(bottle,300,"mL").kind==="ok","suffisant"));test("16 stock insuffisant rouge",()=>assert(app.getExperimentItemAvailability(bottle,10,"L").kind!=="low"&&app.getExperimentItemAvailability(bottle,2000,"mL").kind==="low","insuffisant"));test("17 stock épuisé",()=>assert(app.getExperimentItemAvailability(empty,1,"mL").label==="Stock épuisé","épuisé"));test("18 conversion impossible neutre",()=>assert(app.getExperimentItemAvailability(bottle,1,"L").kind==="warning","conversion"));test("19 terminés exclus",()=>assert(S.available(bottle)===1,"terminé compté"));const mixed={...bottle,stockTracking:{...bottle.stockTracking,closedByLocation:[{location:"R",quantity:1}],openContainers:[{id:"o",remaining:500000,capacity:1000000,status:"open"}]},aliquotTracking:{enabled:true,preparations:[{id:"p",createdCount:2,representedSourceQuantity:500000,locations:[{location:"R",quantity:2}],openAliquots:[],status:"active"}]}};test("20 fermés ouverts aliquotes",()=>assert(S.available(mixed)===2,"total"));test("21 unité recalcule",()=>assert(app.getExperimentItemAvailability(bottle,1500,"mL").kind==="low"&&app.getExperimentItemAvailability(bottle,1500,"µL").kind==="ok","unité"));test("22 quantité recalcule",()=>assert(app.getExperimentItemAvailability(bottle,999,"mL").kind==="ok"&&app.getExperimentItemAvailability(bottle,1001,"mL").kind==="low","quantité"));test("23 item recalcule",()=>assert(app.getExperimentItemAvailability(empty,1,"mL").kind!==app.getExperimentItemAvailability(bottle,1,"mL").kind,"item"));test("24 libre sans calcul",()=>assert(customRow.querySelector(".experiment-stock-state").textContent.includes("Non connecté"),"calcul"));test("25 libre sans inventoryItemId",()=>{customRow.querySelector(".experiment-custom-name").value="DMEM";customRow.querySelector(".experiment-item-quantity").value="25";customRow.querySelector(".experiment-item-unit").value="µL";const line=app.getExperimentRows().find(x=>x.type==="custom");assert(!("inventoryItemId" in line),JSON.stringify(line))});test("26 libre absent inventaire",()=>assert(!app.items.some(i=>i.id==="Produit test client"),"inventaire"));const count=d.querySelectorAll(".experiment-item-row").length;customRow.querySelector(".experiment-remove-line").click();test("27 Retirer ligne seulement",()=>assert(d.querySelectorAll(".experiment-item-row").length===count-1,"retrait"));const stockBefore=S.available(bottle);inventoryRow.querySelector(".experiment-remove-line").click();test("28 retrait sans stock",()=>assert(S.available(bottle)===stockBefore,"stock changé"));test("29 sauvegarde sans item sérialisable",()=>{d.querySelector("#experimentName").value="Libre";assert(app.serializeExperimentDraft("fixture").items.length===0,"items")});app.addExperimentItemRow({type:"custom",name:"",quantity:"",unit:""});test("30 ligne partielle ciblée",()=>assert(!app.validateExperimentConsumedRows()&&!d.querySelector(".experiment-line-error").classList.contains("hidden"),"validation"));d.querySelector("#experimentItemsList").innerHTML="";app.addExperimentItemRow({type:"inventory",inventoryItemId:"stable",quantity:2,unit:"mL"});app.addExperimentItemRow({type:"custom",name:"Libre",quantity:3,unit:"µL"});const saved=app.getExperimentRows();test("31 réouverture conserve types",()=>assert(saved.map(x=>x.type).join(",")==="inventory,custom","types"));test("32 connexion stable",()=>assert(saved[0].inventoryItemId==="stable","id"));test("33 libre reste libre",()=>assert(saved[1].type==="custom"&&!saved[1].inventoryItemId,"libre"));test("34 disponibilité recalculable",()=>assert(app.getExperimentItemAvailability(bottle,300,"mL").kind==="ok","recalcul"));app.activateFreeProtocol({clear:true});test("35 changement vide template",()=>assert(!d.querySelector("#experimentItemsList").children.length&&!d.querySelector("#experimentTemplateNotes").value,"nettoyage"));test("36 confirmation conditionnelle",()=>assert(!app.experimentDraftHasUserData(),"vide considéré sale"));test("37 aucune donnée réelle modifiée",()=>assert(JSON.stringify({items:app.items,experiments:app.applicationExperiments})===before,"mutation réelle"));app.experimentDialog.close();document.querySelector("#result").textContent=rows.join("\n")+`\n${passed}/37 tests réussis`;document.body.dataset.failed=String(passed!==37);document.title=passed===37?"PASS":"FAIL"});document.querySelector("#appFrame").src="../../index.html";
</script></body></html>
