name: Sauvegardes planifiées

on:
  schedule:
    # Déclenché tous les jours (matin Europe/Paris) ; le script décide lui-même si
    # on est dimanche (sauvegarde hebdomadaire) ou premier dimanche du mois (mensuelle).
    # Le déclenchement quotidien laisse une marge si GitHub retarde l'exécution du dimanche.
    - cron: "0 4,5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exadex-scheduled-backups
  cancel-in-progress: false

jobs:
  create-backups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Créer les sauvegardes du dimanche (hebdo + mensuelle si applicable)
        shell: pwsh
        run: ./scripts/create_scheduled_backup.ps1
      - name: Publier uniquement si une copie a été créée
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- backups)" ]; then
            echo "Aucune sauvegarde à publier."
            exit 0
          fi
          git config user.name "ExAdEx Backup"
          git config user.email "contact@exadex-innov.com"
          git add backups
          git commit -m "Sauvegarde automatique $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
