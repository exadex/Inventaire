<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests UI Assistant Inventaire</title><body>
<pre id="result">Tests en cours…</pre>
<iframe id="appFrame" style="position:absolute;left:-10000px;width:1400px;height:900px"></iframe>
<script>
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const frame=document.querySelector("#appFrame");
frame.addEventListener("load",async()=>{
  const w=frame.contentWindow,d=frame.contentDocument,lines=[];
  let passed=0;
  const test=(name,value)=>{lines.push(`${value?"PASS":"FAIL"} ${name}`);if(value)passed++;};
  d.querySelector("#nameInput").value="Test";
  d.querySelector("#loginForm").requestSubmit();
  await wait(2200);
  const firstName="DMEM";
  Object.defineProperty(w,"items",{configurable:true,get:()=>[{id:"ui-item",name:firstName,quantity:5,unit:"unités",location:"Laboratoire",references:{primary:{},secondary:[]},stockTracking:{mode:"simple"}}]});
  d.querySelector('[data-view="agents"]').click();
  await wait(1250);
  const cards=[...d.querySelectorAll(".agent-card")];
  const assistant=cards.find(card=>card.querySelector("h3")?.textContent==="Assistant Inventaire");
  test("carte présente",Boolean(assistant));
  test("carte placée après la rangée existante",assistant===cards[2]);
  test("langage visuel partagé",assistant.classList.contains("agent-card")&&assistant.querySelector(".primary-btn")?.textContent==="Commencer");
  assistant.querySelector("button").click();
  await wait(100);
  test("chat minimal ouvert",Boolean(d.querySelector("#inventoryChatInput")&&d.querySelector("#inventoryChatMessages")));
  const input=d.querySelector("#inventoryChatInput");
  input.value=firstName;
  input.dispatchEvent(new w.KeyboardEvent("keydown",{key:"Enter",bubbles:true}));
  await wait(1250);
  test("Entrée envoie",d.querySelectorAll(".inventory-chat-message.user").length===1&&d.querySelectorAll(".inventory-chat-message.assistant").length===2);
  input.value="ligne 1";
  input.dispatchEvent(new w.KeyboardEvent("keydown",{key:"Enter",shiftKey:true,bubbles:true}));
  test("Maj Entrée n'envoie pas",d.querySelectorAll(".inventory-chat-message.user").length===1);
  const link=d.querySelector("[data-assistant-nav='item']");
  test("résultat lié par ID stable",Boolean(link?.dataset.assistantId));
  let openedItemId="";if(link){w.ExadexAssistantNavigation.item=id=>{openedItemId=id;};link.click();await wait(100);}
  test("lien ouvre la fiche",openedItemId===link?.dataset.assistantId);
  w.renderAgents();
  await wait(100);
  test("conversation conservée pendant la vue",d.querySelectorAll(".inventory-chat-message").length>=2);
  frame.style.width="390px";
  await wait(100);
  const shell=d.querySelector(".inventory-chat-shell");
  test("mobile sans débordement",shell&&shell.scrollWidth<=shell.clientWidth);
  test("champ accessible",d.querySelector("#inventoryChatInput")?.getAttribute("aria-label")&&d.querySelector("#inventoryChatForm button")?.getAttribute("aria-label"));
  document.querySelector("#result").textContent=lines.join("\n")+`\n${passed}/11 tests passed`;
  document.title=passed===11?"PASS":"FAIL";
  document.body.dataset.failed=String(passed!==11);
  w.stop();
});
frame.src="../../index.html";
</script></body></html>
