<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests conversations Assistant</title><body><pre id="result">Tests en cours…</pre><iframe id="appFrame" style="position:absolute;left:-10000px;width:1400px;height:900px"></iframe><script src="../../js/stock/stock_tracking.js"></script><script src="../../js/agents/inventory_assistant.js"></script><script>
const A=ExadexInventoryAssistant,S=StockTracking,lines=[];let passed=0;const test=(name,value)=>{try{if(!value)throw Error("condition fausse");lines.push(`PASS ${name}`);passed++}catch(e){lines.push(`FAIL ${name}: ${e.message}`)}};
const item=(id,name,extra={})=>({id,name,quantity:extra.quantity??1,unit:extra.unit||"unité",category:extra.category||"",notes:extra.notes||"",tags:extra.tags||[],location:extra.location||"Laboratoire",references:{primary:{reference:extra.reference||"",supplier:extra.supplier||""},secondary:[]},...extra});
const qPositive=item("qiazol-pos","QIAzol",{quantity:2,unit:"unités"}),qZero=item("qiazol-zero","QIAzol",{quantity:0,unit:"unités"});
const antibody=item("col6","Anticorps Collagène VI",{category:"Anticorps",location:"Culture L1 → Congélateur −20 °C → Tiroir 2"}),antibody2=item("col6a1","COL6A1 antibody",{category:"Anticorps"}),unrelated=[item("collagenase","Collagénase A",{category:"Enzymes"}),item("procol1","Human Pro-Collagen I alpha 1 DuoSet ELISA"),item("syringe","Seringue 100 mL"),item("sema","Semaglutide")];
const low=item("low","DMEM - low glucose",{quantity:350,unit:"mL"}),high=item("high","DMEM high glucose",{quantity:500,unit:"mL"}),none=item("none","DMEM sans glucose",{quantity:500,unit:"mL"}),f12=item("f12","DMEM/F12",{quantity:500,unit:"mL"}),sabo=item("sabo","Gélose glucosée de Sabouraud",{quantity:500,unit:"mL"});
const info=(row)=>({quantity:row.quantity,unit:row.unit.replace(/s$/,""),display:`${String(row.quantity).replace(".",",")} ${row.unit}`,convertible:true}),adapters={stockInfo:info,locationText:row=>row.location};
let r=A.answer("estc eque jai du qiazol?",[qPositive],adapters);test("01 QIAzol malgré fautes",r.items[0]?.id==="qiazol-pos");test("02 stock positif confirmé",r.text.startsWith("Oui"));
r=A.answer("estc eque jai du qiazol?",[qZero],adapters);test("03 stock nul enregistré et épuisé",/enregistré/.test(r.text)&&/épuisé/.test(r.text));test("04 stock nul jamais disponible",!r.text.startsWith("Oui"));test("05 QIAzol absent",A.answer("estc eque jai du qiazol?",[],adapters).kind==="empty");
const colAnalysis=A.analyze("ou se trouve lanticorps col 6");test("06 intention localisation",colAnalysis.intent==="location");test("07 mots grammaticaux exclus",![...colAnalysis.productTerms,...colAnalysis.typeTerms].some(x=>["se","ou","l"].includes(x)));test("08 col 6 développé",colAnalysis.scientific?.variants.some(x=>x==="collagen vi")&&colAnalysis.label==="anticorps Collagène VI");
const colResults=A.search("ou se trouve lanticorps col 6",[antibody,antibody2,...unrelated]).results;test("09 anticorps VI prioritaire",colResults[0].item.id==="col6");test("10 collagénase exclue",!colResults.some(x=>x.item.id==="collagenase"));test("11 Pro-Collagène I exclu",!colResults.some(x=>x.item.id==="procol1"));test("12 seringue exclue",!colResults.some(x=>x.item.id==="syringe"));test("13 Semaglutide exclu",!colResults.some(x=>x.item.id==="sema"));test("14 absence fiable honnête",A.answer("ou se trouve lanticorps col 6",unrelated,adapters).kind==="empty");
const sentence="je vais utiliser 200mL de milieu DMEM low glucose, est ce que jen ai assez ?",analysis=A.analyze(sentence);test("15 phrase décomposée",analysis.intent==="sufficiency"&&analysis.productTerms.includes("dmem")&&analysis.qualifiers.includes("low")&&analysis.quantity.value===200&&analysis.quantity.unit==="mL");test("16 libellé discriminant",analysis.label==="dmem low glucose");test("17 verbes non recherchés",![...analysis.productTerms,...analysis.qualifiers].some(x=>["vais","utiliser","jen","ai","assez"].includes(x)));
const dmemItems=[low,high,none,f12,sabo],dmemResults=A.search(sentence,dmemItems).results;test("18 low glucose principal",dmemResults[0].item.id==="low");test("19 high glucose exclu",!dmemResults.some(x=>x.item.id==="high"));test("20 sans glucose exclu",!dmemResults.some(x=>x.item.id==="none"));test("21 F12 non équivalent",!dmemResults.some(x=>x.item.id==="f12"));test("22 Sabouraud exclu",!dmemResults.some(x=>x.item.id==="sabo"));
r=A.answer(sentence,[low],adapters);test("23 comparaison réelle",/200 mL/.test(r.text)&&/350 mL/.test(r.text));test("24 stock supérieur et reste",r.text.startsWith("Oui")&&/150 mL/.test(r.text));const low150={...low,quantity:150};r=A.answer(sentence,[low150],adapters);test("25 stock inférieur et manque",r.text.startsWith("Non")&&/50 mL/.test(r.text));const low200={...low,quantity:200};r=A.answer(sentence,[low200],adapters);test("26 stock égal",/exactement suffisante/.test(r.text)&&/plus de stock/.test(r.text));const bottles=item("bottles","DMEM - low glucose",{quantity:2,unit:"bouteilles"});r=A.answer(sentence,[bottles],adapters);test("27 capacité inconnue",/ne permet pas|pas suffisamment renseignée/.test(r.text));
const known=item("known","DMEM - low glucose",{quantity:2,unit:"bouteilles",stockTracking:{mode:"containers",packagingLevels:[{key:"bottle",singular:"bouteille",plural:"bouteilles",contains:1},{key:"ml",singular:"mL",plural:"mL",kind:"continuous",contains:500}],trackingUnitKey:"ml",trackingUnit:"mL",closedContainers:[{id:"c1",remaining:500,capacity:500,status:"closed"},{id:"c2",remaining:500,capacity:500,status:"closed"}],openContainers:[]}});const trackedInfo=row=>{const t=S.normalizeTracking(row);return{quantity:S.available(row)*S.capacity(t),unit:t.trackingUnit,display:`${S.format(S.available(row)*S.capacity(t))} ${t.trackingUnit}`,convertible:true}};r=A.answer(sentence,[known],{stockInfo:trackedInfo,locationText:row=>row.location});test("28 deux bouteilles connues = 1000 mL",/1[\s ]?000 mL/.test(r.text));
const mixed={...known,id:"mixed",stockTracking:{...known.stockTracking,closedContainers:[{id:"c1",remaining:500,capacity:500,status:"closed"}],openContainers:[{id:"o1",remaining:250,capacity:500,status:"open"},{id:"done",remaining:0,capacity:500,status:"finished"}]}};test("29 ouverts et fermés intégrés",S.available(mixed)===1.5);test("30 terminés exclus",S.available(mixed)*S.capacity(S.normalizeTracking(mixed))===750);test("31 conversions volume",A.convertQuantity(1000,"µL","mL")===1&&A.convertQuantity(1,"L","mL")===1000);test("32 conversion incompatible refusée",A.convertQuantity(1,"g","mL")===null);
const before=JSON.stringify(dmemItems);A.answer(sentence,dmemItems,adapters);test("33 aucune donnée modifiée",JSON.stringify(dmemItems)===before);test("34 résultat exact seul",dmemResults.length===1);test("35 décimales françaises",A.sufficiencyText({stockQuantity:350.5,stockUnit:"mL",stock:"350,5 mL",convertible:true},{value:200,unit:"mL"},"DMEM").includes("350,5"));
const follow=A.answer("Et où est-il ?",[low],adapters,{context:{lastItemIds:["low"]}});test("36 suivi dernier item",follow.items[0]?.id==="low"&&follow.analysis.intent==="location");test("37 suivi ambigu demande précision",A.answer("Et où est-il ?",[low,high],adapters,{context:{lastItemIds:["low","high"]}}).kind==="clarify");test("38 lecture seule",A.answer("Ajoute 3 DMEM",[low],adapters).kind==="readonly");
const frame=document.querySelector("#appFrame");frame.addEventListener("load",async()=>{const w=frame.contentWindow,d=frame.contentDocument,wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));d.querySelector("#nameInput").value="Test";d.querySelector("#loginForm").requestSubmit();await wait(2200);d.querySelector('[data-view="agents"]').click();await wait(80);[...d.querySelectorAll(".agent-card")].find(card=>card.textContent.includes("Assistant Inventaire"))?.querySelector("button").click();await wait(1250);test("39 accueil premier message",d.querySelector(".inventory-chat-message.assistant p")?.textContent.startsWith("Bonjour 👋, je suis l’Assistant Inventaire."));w.renderAgents();await wait(50);test("40 accueil non dupliqué",[...d.querySelectorAll(".inventory-chat-message.assistant p")].filter(p=>p.textContent.startsWith("Bonjour 👋, je suis")).length===1);test("41 aucun bouton suggestion",!d.querySelector(".inventory-chat-message button:not([data-assistant-item])"));const cards=d.querySelectorAll(".inventory-chat-result");test("42 hiérarchie visuelle séparée",!cards.length||getComputedStyle(cards[0]).gap!=="normal");frame.style.width="390px";await wait(80);test("43 mobile sans débordement",d.querySelector(".inventory-chat-shell").scrollWidth<=d.querySelector(".inventory-chat-shell").clientWidth);document.querySelector("#result").textContent=lines.join("\n")+`\n${passed}/43 tests passed`;document.title=passed===43?"PASS":"FAIL";document.body.dataset.failed=String(passed!==43);w.stop();});frame.src="../../index.html";
</script></body></html>
