<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Shared sync isolated tests</title></head>
<body><pre id="results">RUNNING</pre>
<script src="../../js/storage/shared_sync.js"></script>
<script>
(async function () {
  const lines = [];
  let passed = 0;
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  async function test(name, callback) {
    try { await callback(); lines.push(`PASS ${name}`); passed += 1; }
    catch (error) { lines.push(`FAIL ${name}: ${error.message}`); }
  }
  const item = (id, name, stock = 1) => ({ id, name, stock });
  const state = items => ({ inventoryItems: items, history: [], locationCatalog: { locations: [] } });

  await test("01 normal save updates SHA", async () => {
    const used = [];
    const coordinator = ExadexSharedSync.createSaveCoordinator({ initialBase: state([]), initialSha: "sha-1", save: async (data, sha) => { used.push(sha); return "sha-2"; }, loadRemote: async () => null });
    await coordinator.enqueue(state([item("a", "A")]));
    assert(used[0] === "sha-1" && coordinator.getState().sha === "sha-2", "SHA was not updated");
  });

  await test("02 close saves are serialized", async () => {
    let active = 0, maxActive = 0, calls = 0;
    const coordinator = ExadexSharedSync.createSaveCoordinator({ initialBase: state([]), initialSha: "s1", save: async () => { active++; maxActive = Math.max(maxActive, active); await wait(20); active--; return `s${++calls + 1}`; }, loadRemote: async () => null });
    const first = coordinator.enqueue(state([item("a", "A")]));
    const second = coordinator.enqueue(state([item("a", "B")]));
    await Promise.all([first, second]);
    assert(maxActive === 1, "concurrent requests detected");
  });

  await test("03 edits during save are retained", async () => {
    const names = [], pendingFlags = [];
    const coordinator = ExadexSharedSync.createSaveCoordinator({ initialBase: state([]), initialSha: "s1", save: async data => { names.push(data.inventoryItems[0].name); await wait(15); return `s${names.length + 1}`; }, loadRemote: async () => null, onSaved: result => pendingFlags.push(result.pending) });
    const pending = coordinator.enqueue(state([item("a", "A")]));
    await wait(2); coordinator.enqueue(state([item("a", "B")]));
    await pending;
    assert(names.at(-1) === "B" && !coordinator.getState().pending && pendingFlags.join() === "true,false", "latest edit or pending marker was lost");
  });

  await test("04 different items merge", () => {
    const base = state([item("a", "A"), item("b", "B")]);
    const local = state([item("a", "Local"), item("b", "B")]);
    const remote = state([item("a", "A"), item("b", "Remote")]);
    const result = ExadexSharedSync.mergeSharedData(base, local, remote);
    assert(!result.conflicts.length && result.data.inventoryItems.map(x => x.name).join() === "Local,Remote", "independent item merge failed");
  });

  await test("05 different fields on same item merge", () => {
    const base = state([item("a", "A", 1)]), local = state([item("a", "Local", 1)]), remote = state([item("a", "A", 2)]);
    const result = ExadexSharedSync.mergeSharedData(base, local, remote);
    assert(!result.conflicts.length && result.data.inventoryItems[0].name === "Local" && result.data.inventoryItems[0].stock === 2, "field merge failed");
  });

  await test("06 same field divergence conflicts", () => {
    const base = state([item("a", "A")]), local = state([item("a", "Local")]), remote = state([item("a", "Remote")]);
    const result = ExadexSharedSync.mergeSharedData(base, local, remote);
    assert(result.conflicts.some(x => x.path.includes("name")), "conflict was not explicit");
  });

  await test("07 local addition is preserved", () => {
    const result = ExadexSharedSync.mergeSharedData(state([]), state([item("a", "A")]), state([]));
    assert(result.data.inventoryItems.length === 1 && !result.conflicts.length, "local addition lost");
  });

  await test("08 remote addition is preserved", () => {
    const result = ExadexSharedSync.mergeSharedData(state([]), state([]), state([item("a", "A")]));
    assert(result.data.inventoryItems.length === 1 && !result.conflicts.length, "remote addition lost");
  });

  await test("09 conflicting delete is explicit", () => {
    const base = state([item("a", "A")]), local = state([]), remote = state([item("a", "Remote")]);
    assert(ExadexSharedSync.mergeSharedData(base, local, remote).conflicts.length === 1, "delete/update conflict missing");
  });

  await test("10 clean local delete is preserved", () => {
    const base = state([item("a", "A")]);
    assert(ExadexSharedSync.mergeSharedData(base, state([]), base).data.inventoryItems.length === 0, "local delete lost");
  });

  await test("11 409 retains local and merges remote", async () => {
    const base = state([item("a", "A"), item("b", "B")]); let calls = 0, saved;
    const coordinator = ExadexSharedSync.createSaveCoordinator({ initialBase: base, initialSha: "old", save: async (data, sha) => { calls++; if (calls === 1) throw Object.assign(new Error("409"), { code: "GITHUB_CONFLICT", status: 409 }); saved = data; assert(sha === "remote-sha", "retry did not use remote SHA"); return "new-sha"; }, loadRemote: async () => ({ data: state([item("a", "A"), item("b", "Remote")]), sha: "remote-sha" }) });
    await coordinator.enqueue(state([item("a", "Local"), item("b", "B")]));
    assert(saved.inventoryItems.map(x => x.name).join() === "Local,Remote", "409 merge lost data");
  });

  await test("12 409 same-field does not overwrite", async () => {
    const statuses = []; let conflicts;
    const base = state([item("a", "A")]);
    const coordinator = ExadexSharedSync.createSaveCoordinator({ initialBase: base, initialSha: "old", save: async () => { throw Object.assign(new Error("409"), { status: 409 }); }, loadRemote: async () => ({ data: state([item("a", "Remote")]), sha: "remote" }), onConflict: value => conflicts = value, onStatus: value => statuses.push(value) });
    await coordinator.enqueue(state([item("a", "Local")]));
    assert(conflicts.local.inventoryItems[0].name === "Local" && statuses.includes("conflict"), "local conflict state lost");
  });

  await test("13 network error never reports saved", async () => {
    const statuses = [];
    const coordinator = ExadexSharedSync.createSaveCoordinator({ initialBase: state([]), save: async () => { throw new Error("offline"); }, loadRemote: async () => null, onStatus: value => statuses.push(value) });
    try { await coordinator.enqueue(state([item("a", "A")])); } catch {}
    assert(statuses.includes("error") && !statuses.includes("saved"), "false success reported");
  });

  await test("14 retry count is bounded", async () => {
    let calls = 0;
    const coordinator = ExadexSharedSync.createSaveCoordinator({ initialBase: state([]), save: async () => { calls++; throw Object.assign(new Error("409"), { status: 409 }); }, loadRemote: async () => ({ data: state([]), sha: "new" }) });
    try { await coordinator.enqueue(state([item("a", "A")])); } catch {}
    assert(calls === 2, `expected 2 attempts, got ${calls}`);
  });

  await test("15 history entries with IDs are both preserved", () => {
    const base = { history: [] }, local = { history: [{ id: "l", action: "local" }] }, remote = { history: [{ id: "r", action: "remote" }] };
    const result = ExadexSharedSync.mergeSharedData(base, local, remote);
    assert(result.data.history.length === 2 && !result.conflicts.length, "history union failed");
  });

  await test("16 unchanged stock/location survives unrelated merge", () => {
    const base = { inventoryItems: [{ id: "a", name: "A", stock: 8, location: "room" }] };
    const local = { inventoryItems: [{ id: "a", name: "Local", stock: 8, location: "room" }] };
    const remote = { inventoryItems: [{ id: "a", name: "A", stock: 8, location: "room" }] };
    const result = ExadexSharedSync.mergeSharedData(base, local, remote);
    assert(result.data.inventoryItems[0].stock === 8 && result.data.inventoryItems[0].location === "room", "unrelated data changed");
  });

  await test("16b edit arriving during 409 recovery keeps remote merge", async () => {
    const base = state([item("a", "A", 1), item("b", "B", 1)]), saved = []; let first = true;
    const coordinator = ExadexSharedSync.createSaveCoordinator({ initialBase: base, initialSha: "old", save: async (data, sha) => { if (first) { first = false; throw Object.assign(new Error("409"), { status: 409 }); } saved.push(JSON.parse(JSON.stringify(data))); await wait(10); return `sha-${saved.length}`; }, loadRemote: async () => { await wait(10); return { data: state([item("a", "A", 1), item("b", "Remote", 1)]), sha: "remote-sha" }; } });
    const pending = coordinator.enqueue(state([item("a", "Local", 1), item("b", "B", 1)]));
    await wait(3); coordinator.enqueue(state([item("a", "Newest", 1), item("b", "B", 1)]));
    await pending;
    const finalItems = saved.at(-1).inventoryItems;
    assert(finalItems[0].name === "Newest" && finalItems[1].name === "Remote", "pending edit or remote merge was lost");
  });

  await test("17 concurrent legacy history additions are both preserved", () => {
    const original = { date: "01/08/2026 10:00", user: "Caroline", action: "Création", detail: "Base" };
    const localEntry = { date: "01/08/2026 10:01", user: "Caroline", action: "Item modifié", detail: "Nom local" };
    const remoteEntry = { date: "01/08/2026 10:01", user: "Julien", action: "Item modifié", detail: "Note distante" };
    const result = ExadexSharedSync.mergeSharedData({ history: [original] }, { history: [localEntry, original] }, { history: [remoteEntry, original] });
    assert(!result.conflicts.length && result.data.history.length === 3 && result.data.history.some(row => row.user === "Caroline") && result.data.history.some(row => row.user === "Julien"), "append-only history merge lost an entry");
  });

  lines.push(`${passed}/18 tests passed`);
  document.getElementById("results").textContent = lines.join("\n");
  document.title = passed === 18 ? "PASS" : "FAIL";
})();
</script></body></html>
