<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests avatars Assistant Inventaire</title><body><pre id="result">Tests en cours…</pre><iframe id="appFrame" style="position:absolute;left:-10000px;width:1400px;height:900px"></iframe><script>
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms)),frame=document.querySelector("#appFrame");
frame.addEventListener("load",async()=>{const w=frame.contentWindow,d=frame.contentDocument,lines=[];let passed=0;const test=(name,value)=>{lines.push(`${value?"PASS":"FAIL"} ${name}`);if(value)passed++;};const dom=html=>{const box=d.createElement("div");box.innerHTML=html;return box;};
d.querySelector("#nameInput").value="Caroline";d.querySelector("#loginForm").requestSubmit();await wait(2200);d.querySelector('[data-view="agents"]').click();await wait(60);[...d.querySelectorAll(".agent-card")].find(card=>card.textContent.includes("Assistant Inventaire"))?.querySelector("button").click();await wait(1250);const api=w.ExadexAgentsUI;
const isolatedAssistant=dom(api.assistantConversationMarkup([{role:"assistant",text:"Bonjour"}],null,"🧪"));test("1 assistant isolé : robot à gauche",isolatedAssistant.querySelector(".assistant>.inventory-chat-avatar.assistant")?.textContent==="🤖");
const assistantGroup=dom(api.assistantConversationMarkup([{role:"assistant",text:"A1"},{role:"assistant",text:"A2"},{role:"assistant",text:"A3"}],null,"🧪"));test("2 groupe assistant : avatar sur le dernier",assistantGroup.querySelectorAll(".inventory-chat-avatar").length===1&&assistantGroup.lastElementChild.querySelector(".inventory-chat-avatar")?.textContent==="🤖");
const isolatedUser=dom(api.assistantConversationMarkup([{role:"user",text:"U1"}],null,"🧪"));test("3 utilisateur isolé : avatar à droite",isolatedUser.querySelector(".user>.inventory-chat-avatar.user")?.textContent==="🧪");
const userGroup=dom(api.assistantConversationMarkup([{role:"user",text:"U1"},{role:"user",text:"U2"}],null,"🧪"));test("4 groupe utilisateur : avatar sur le dernier",userGroup.querySelectorAll(".inventory-chat-avatar").length===1&&userGroup.lastElementChild.querySelector(".inventory-chat-avatar.user"));
const alternating=dom(api.assistantConversationMarkup([{role:"assistant",text:"A"},{role:"user",text:"U"},{role:"assistant",text:"A2"}],null,"🧪"));test("5 changement d’auteur : nouveau groupe",alternating.querySelectorAll(".inventory-chat-avatar").length===3);
test("6 emoji du compte connecté",api.assistantUserEmoji()==="🧪"&&d.querySelector(".inventory-chat-avatar.user")===null);
const badge=d.querySelector("#currentUser"),accountEmoji=badge.textContent;badge.textContent="CB";test("7 fallback sans emoji valide",api.assistantUserEmoji()==="👤"&&dom(api.assistantConversationMarkup([{role:"user",text:"test"}])).querySelector(".inventory-chat-avatar")?.textContent==="👤");badge.textContent=accountEmoji;
test("8 accueil avec avatar robot",d.querySelector(".inventory-chat-message.assistant .inventory-chat-avatar")?.textContent==="🤖");
const input=d.querySelector("#inventoryChatInput");input.value="DMEM";input.dispatchEvent(new w.KeyboardEvent("keydown",{key:"Enter",bubbles:true}));await wait(20);test("9 indicateur avec avatar temporaire",d.querySelector(".inventory-chat-thinking .inventory-chat-avatar.assistant")?.textContent==="🤖");await wait(1250);test("10 remplacement sans avatar dupliqué",!d.querySelector(".inventory-chat-thinking")&&d.querySelectorAll(".inventory-chat-message.assistant:last-of-type .inventory-chat-avatar").length<=1);
const recalculated=dom(api.assistantConversationMarkup([{role:"assistant",text:"A1"},{role:"assistant",text:"A2"},{role:"user",text:"U1"},{role:"user",text:"U2"},{role:"assistant",text:"A3"}],null,"🧪"));test("11 recalcul des fins de groupe",[...recalculated.children].map(row=>Boolean(row.querySelector(".inventory-chat-avatar"))).join(",")==="false,true,false,true,true");
const longText="Message particulièrement long destiné à vérifier le retour à la ligne sans débordement horizontal. ".repeat(8),longBox=dom(`<div class="inventory-chat-messages" style="width:360px">${api.assistantConversationMarkup([{role:"assistant",text:longText},{role:"user",text:longText}],null,"🧪")}</div>`);d.body.appendChild(longBox);test("12 messages longs sans débordement",longBox.firstElementChild.scrollWidth<=longBox.firstElementChild.clientWidth);longBox.remove();
frame.style.width="390px";await wait(50);const chat=d.querySelector("#inventoryChatMessages");test("13 avatars sans débordement mobile",chat.scrollWidth<=chat.clientWidth&&[...chat.querySelectorAll(".inventory-chat-avatar")].every(avatar=>avatar.getBoundingClientRect().left>=chat.getBoundingClientRect().left));
test("14 avatars décoratifs",[...d.querySelectorAll(".inventory-chat-avatar")].every(avatar=>avatar.getAttribute("aria-hidden")==="true")&&[...d.querySelectorAll(".inventory-chat-message")].every(message=>message.getAttribute("aria-label")));
document.querySelector("#result").textContent=lines.join("\n")+`\n${passed}/14 tests passed`;document.title=passed===14?"PASS":"FAIL";document.body.dataset.failed=String(passed!==14);w.stop();});frame.src="../../index.html";
</script></body></html>
