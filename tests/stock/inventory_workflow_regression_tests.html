<!doctype html><html lang="fr"><meta charset="utf-8"><title>Régressions parcours inventaire</title><body><pre id="result"></pre><script src="../../js/stock/stock_tracking.js"></script><script>
const out=[],test=(n,f)=>{try{f();out.push(`✓ ${n}`)}catch(e){out.push(`✗ ${n}: ${e.message}`)}},ok=(v,m)=>{if(!v)throw Error(m)};
const item=()=>({id:"fixture",name:"Fixture isolée",quantity:2,unit:"bouteilles",stockTracking:{mode:"containers",traceabilityMode:"detailed",packagingLevels:[{key:"bouteille",singular:"bouteille",plural:"bouteilles",contains:1},{key:"ml",singular:"mL",plural:"mL",kind:"continuous",contains:100}],trackingUnitKey:"ml",closedContainers:[{id:"c1",label:"Bouteille fermée",location:"Salle → Frigo",roomId:"r1",locationId:"l1",remaining:100,capacity:100,unitKey:"ml",status:"closed",version:1},{id:"c2",label:"Bouteille fermée",location:"Salle → Frigo",roomId:"r1",locationId:"l1",remaining:100,capacity:100,unitKey:"ml",status:"closed",version:1}],openContainers:[]},aliquotTracking:{enabled:true,preparations:[]}});
const op=(type,x={})=>({operationId:StockTracking.id("test"),type,...x});
test("stock total avec contenant partiel",()=>{const x=item();x.stockTracking.openContainers=[{id:"o",remaining:30,capacity:100,status:"open",version:1}];x.stockTracking.closedContainers=x.stockTracking.closedContainers.slice(0,1);ok(StockTracking.available(x)===1.3,"total")});
test("contenants terminés exclus",()=>{const x=item();x.stockTracking.openContainers=[{id:"f",remaining:100,capacity:100,status:"finished",version:1}];ok(StockTracking.available(x)===2,"terminé compté")});
test("retrait de la dernière unité active",()=>{const x=item();x.stockTracking.closedContainers=x.stockTracking.closedContainers.slice(0,1);const r=StockTracking.apply(x,op("containers_recounted",{comment:"Inventaire",changes:[{containerId:"c1",expectedVersion:1,status:"finished",unitKey:"ml",location:"Salle → Frigo",quantity:0,capacity:100}]}),{name:"Test"});ok(r.item.quantity===0,"stock non nul");ok(r.item.stockTracking.openContainers[0].status==="finished","trace perdue")});
test("retrait groupé, un résultat atomique",()=>{const r=StockTracking.apply(item(),op("containers_recounted",{comment:"Inventaire",changes:["c1","c2"].map(id=>({containerId:id,expectedVersion:1,status:"finished",unitKey:"ml",location:"Salle → Frigo",quantity:0,capacity:100}))}),{name:"Test"});ok(r.item.quantity===0&&r.events.length===2,"résultat")});
test("préparation partielle depuis contenant fermé",()=>{const r=StockTracking.apply(item(),op("aliquots_prepared",{sourceType:"closed",sourceId:"c1",sourceQuantity:40,representedSourceQuantity:40,createdCount:4,volume:10,volumeUnit:"mL",concentration:1,concentrationUnit:"%",locations:[{location:"Salle → Congélateur",quantity:4}]}),{name:"Test"});const source=r.item.stockTracking.openContainers.find(x=>x.id==="c1");ok(source.status==="open"&&source.remaining===60,"source incorrecte");ok(r.item.aliquotTracking.preparations.length===1,"préparation absente")});
test("préparation totale termine la source",()=>{const r=StockTracking.apply(item(),op("aliquots_prepared",{sourceType:"closed",sourceId:"c1",sourceQuantity:100,representedSourceQuantity:100,createdCount:10,volume:10,volumeUnit:"mL",locations:[{location:"Salle → Congélateur",quantity:10}]}),{name:"Test"});ok(r.item.stockTracking.openContainers.find(x=>x.id==="c1").status==="finished","non terminé")});
test("surconsommation source refusée",()=>{let refused=false;try{StockTracking.apply(item(),op("aliquots_prepared",{sourceType:"closed",sourceId:"c1",sourceQuantity:101,representedSourceQuantity:101,createdCount:1,locations:[{location:"L",quantity:1}]}),{name:"Test"})}catch{refused=true}ok(refused,"acceptée")});
test("contenant terminé interdit comme source",()=>{const x=item();x.stockTracking.closedContainers=x.stockTracking.closedContainers.filter(row=>row.id!=="c1");x.stockTracking.openContainers.push({id:"c1",remaining:0,capacity:100,status:"finished",version:2});let refused=false;try{StockTracking.apply(x,op("aliquots_prepared",{sourceType:"closed",sourceId:"c1",sourceQuantity:10,representedSourceQuantity:10,createdCount:1,locations:[{location:"L",quantity:1}]}),{name:"Test"})}catch{refused=true}ok(refused,"accepté")});
test("timestamp complet de préparation",()=>{const r=StockTracking.apply(item(),op("aliquots_prepared",{sourceType:"closed",sourceId:"c1",sourceQuantity:10,representedSourceQuantity:10,createdCount:1,locations:[{location:"L",quantity:1}]}),{name:"Test"});ok(/T\d{2}:\d{2}/.test(r.item.aliquotTracking.preparations[0].preparedAt),"heure absente")});
test("correction absolue d'une préparation",()=>{let x=StockTracking.apply(item(),op("aliquots_prepared",{sourceType:"closed",sourceId:"c1",sourceQuantity:40,representedSourceQuantity:40,createdCount:4,volume:10,volumeUnit:"mL",locations:[{location:"L",quantity:4}]}),{name:"Test"}).item;const p=x.aliquotTracking.preparations[0],r=StockTracking.apply(x,op("preparation_corrected",{entityId:p.id,expectedVersion:p.version,availableCount:2,volume:12,volumeUnit:"mL",concentration:50,concentrationUnit:"%",location:"Salle → L",roomId:"r",locationId:"l",comment:"Correction"}),{name:"Test"});const q=r.item.aliquotTracking.preparations[0];ok(q.id===p.id&&StockTracking.remainingAliquots(q)===2&&q.volume===12,"correction")});
test("correction à zéro conserve le lot",()=>{let x=StockTracking.apply(item(),op("aliquots_prepared",{sourceType:"closed",sourceId:"c1",sourceQuantity:10,representedSourceQuantity:10,createdCount:1,locations:[{location:"L",quantity:1}]}),{name:"Test"}).item;const p=x.aliquotTracking.preparations[0],r=StockTracking.apply(x,op("preparation_corrected",{entityId:p.id,expectedVersion:p.version,availableCount:0,volume:1,location:"L",comment:"Épuisé"}),{name:"Test"});ok(r.item.aliquotTracking.preparations[0].status==="finished","lot supprimé ou actif")});
document.querySelector('#result').textContent=out.join('\n');document.body.dataset.failed=String(out.some(x=>x.startsWith('✗')));
</script></body></html>
