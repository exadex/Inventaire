<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../assets/css/design.css"><title>Tests résultats audit</title></head>
<body><div id="agentsRoot"></div><p id="result">En cours…</p>
<script src="../../js/agents/agents_core.js"></script><script src="../../js/agents/agents_storage.js"></script><script>
localStorage.clear();sessionStorage.clear();let confirmation=null,deletionRequest=null,businessWrites=0;
let testItems=Array.from({length:16},(_,i)=>({id:"i"+i,name:"Produit "+i,quantity:i,unit:"u",category:"C"}));
const scores=[21,39,40,64,65,84,85,100];
const alerts=scores.map((score,i)=>({id:"a"+score,type:"Doublon potentiel",severity:"warning",confidence:ExadexAgentsCore.confidenceFromScore(score),duplicateScore:score,confidenceScore:score,itemIds:["i"+(i*2),"i"+(i*2+1)],reasons:["Nom fortement similaire : +30"],scoreDetails:{positive:["Nom fortement similaire : +30"],differences:[],terms:[30],rawScore:score,boundedScore:score,capped:false},state:"pending"}));
alerts[0].scoreDetails.differences=["Références différentes : REF-A ≠ REF-B : −10"];
const report={id:"audit-ui",rulesVersion:3,scoreEngine:"duplicate-score-v3",createdAt:new Date().toISOString(),itemCount:16,totalAlertCount:8,alerts,summary:{critical:0,warnings:8,info:0,duplicates:8}};
const referenceReport={id:"audit-references-ui",auditType:"references",scope:"references",rulesVersion:3,scoreEngine:"duplicate-score-v3",createdAt:new Date(Date.now()-60000).toISOString(),itemCount:4,totalAlertCount:4,alerts:[
 {id:"ref-diff",type:"Doublon potentiel avec références différentes",auditScope:"references",referenceCriterion:"different-duplicates",severity:"warning",itemIds:["i0","i1"],observed:"A ≠ B",state:"pending"},
 {id:"ref-missing",type:"Référence principale non renseignée",auditScope:"references",referenceCriterion:"missing",severity:"warning",itemIds:["i2"],observed:"vide",state:"pending"},
 {id:"ref-contact",type:"Référence non enregistrée dans les Contacts",auditScope:"references",referenceCriterion:"unregistered-contact",severity:"warning",itemIds:["i3"],observed:"REF-3",state:"pending"},
 {id:"ref-contact-reviewed",type:"Référence non enregistrée dans les Contacts",auditScope:"references",referenceCriterion:"unregistered-contact",severity:"warning",itemIds:["i4"],observed:"REF-4",state:"reviewed"}
],summary:{critical:0,warnings:4,info:0,duplicates:1}};
ExadexAgentsStorage.saveWorkspace({audits:[report,referenceReport],sessions:[]},localStorage);
Object.defineProperties(window,{items:{get:()=>JSON.parse(JSON.stringify(testItems))},orders:{get:()=>[]},inventoryLocations:{get:()=>[]},inventoryCategories:{get:()=>["C"]},currentName:{get:()=>"Test"}});
window.openDeleteConfirmation=options=>{confirmation=options};
window.openItemDetail=()=>{};
window.requestItemDeletionById=(id,options)=>{deletionRequest={id,options}};
window.ExadexGithubStorage={mutateSharedData(){businessWrites++}};
</script><script src="../../js/agents/agents_ui.js"></script><script>
let passed=0;const check=(v,m)=>{if(!v)throw new Error(m);passed++};
ExadexAgentsUI.renderAgents();check(document.querySelector(".audit-type-badge").textContent==="Type non renseigné","badge neutre pour ancien audit");document.querySelector("[data-open-audit]").click();
check(["full","duplicates","stock","references"].map(ExadexAgentsUI.auditTypeLabel).join("|")==="Audit complet|Doublons uniquement|Stocks et seuils|Références","libellés des quatre types");
check(ExadexAgentsUI.auditTypeLabel("")==="Type non renseigné","ancien audit sans type neutre");
check(ExadexAgentsUI.remainingLabel({alerts:[]})==="0 alertes restantes","libellé zéro alerte");
check(ExadexAgentsUI.remainingLabel({alerts:[{state:"pending"}]})==="1 alerte restante","libellé singulier");
check(ExadexAgentsUI.remainingLabel({alerts:[{state:"pending"},{state:"pending"}]})==="2 alertes restantes","libellé pluriel");
check(document.querySelectorAll(".audit-scope-group").length===5,"audit complet utilise les catégories repliables");
check(document.querySelectorAll('.audit-group-toggle[aria-expanded="true"]').length===0&&[...document.querySelectorAll(".audit-group-panel")].every(panel=>panel.hidden),"toutes les catégories initialement fermées");
check(!document.querySelector("#auditAlerts [data-select-group]")&&![...document.querySelectorAll("#auditAlerts button,#auditAlerts label")].some(node=>node.textContent.includes("Tout sélectionner")),"aucune sélection globale des alertes");
check(Number(document.querySelector("#auditDeletedCount").textContent)===0&&![...document.querySelectorAll(".audit-live-metrics span")].some(node=>node.textContent==="Conservées"),"ancien rapport initialise Effacées à zéro");
const duplicatesToggle=[...document.querySelectorAll(".audit-group-toggle")].find(button=>button.textContent.includes("Doublons potentiels"));duplicatesToggle.click();
check([...document.querySelectorAll(".audit-group-toggle")].find(button=>button.textContent.includes("Doublons potentiels")).getAttribute("aria-expanded")==="true","catégorie doublons ouverte au clic");
const stockToggle=[...document.querySelectorAll(".audit-group-toggle")].find(button=>button.textContent.includes("Stocks et seuils"));stockToggle.click();
check([...document.querySelectorAll(".audit-group-toggle")].find(button=>button.textContent.includes("Stocks et seuils")).getAttribute("aria-expanded")==="true","catégorie ouverte au clic");
[...document.querySelectorAll(".audit-group-toggle")].find(button=>button.textContent.includes("Stocks et seuils")).click();
check([...document.querySelectorAll(".audit-group-toggle")].find(button=>button.textContent.includes("Stocks et seuils")).getAttribute("aria-expanded")==="false","catégorie refermée au clic");
const cards=()=>[...document.querySelectorAll(".audit-alert")];
const byScore=s=>document.querySelector(`[data-confidence-score="${s}"]`);
check(byScore(21).classList.contains("score-yellow"),"21 jaune");
check(byScore(39).classList.contains("score-yellow"),"39 jaune");
check(byScore(40).classList.contains("score-orange"),"40 orange");
check(byScore(64).classList.contains("score-orange"),"64 orange");
check(byScore(65).classList.contains("score-red"),"65 rouge");
check(byScore(84).classList.contains("score-red"),"84 rouge");
check(byScore(85).classList.contains("score-dark-red"),"85 rouge foncé");
check(byScore(100).classList.contains("score-dark-red"),"100 rouge foncé");
check(cards().map(x=>Number(x.dataset.confidenceScore)).join(",")==="100,85,84,65,64,40,39,21","tri décroissant");
check(!document.querySelector(".agent-report-controls"),"barre de recherche et tri supprimée");
check(byScore(21).textContent.includes("Références différentes : REF-A ≠ REF-B")&&!byScore(21).textContent.includes("−10"),"pénalité masquée visuellement");
check(!byScore(100).querySelector(".score-explanation"),"détail du calcul masqué");
check(byScore(100).querySelector(".audit-item-names strong"),"noms visibles");
check(!byScore(100).textContent.includes("AVERTISSEMENT")&&!byScore(100).textContent.includes("Recommandation")&&!byScore(100).textContent.includes("Valeurs observées"),"carte simplifiée");
const before=Number(document.querySelector("#auditRemainingCount").textContent);byScore(100).querySelector("[data-review]").click();
check(document.querySelector('[data-confidence-score="100"]').classList.contains("reviewed"),"bordure verte examinée");
check(Number(cards().at(-1).dataset.confidenceScore)===100,"examinée en bas");
check(Number(document.querySelector("#auditRemainingCount").textContent)===before-1,"compteur décrémenté");
document.querySelector('[data-confidence-score="100"] [data-review]').click();
check(Number(document.querySelector("#auditRemainingCount").textContent)===before-1,"pas de double décrément");
check(ExadexAgentsUI._load().audits[0].alerts.find(a=>a.duplicateScore===100).state==="reviewed","état persisté");
document.querySelector('[data-confidence-score="100"] [data-clear-alert]').click();
check(Boolean(confirmation)&&confirmation.confirmText==="Effacer l’alerte","confirmation effacement");
const activeBefore=Number(document.querySelector("#auditRemainingCount").textContent);confirmation.onConfirm();
check(!document.querySelector('[data-confidence-score="100"]'),"alerte effacée");
check(Number(document.querySelector("#auditRemainingCount").textContent)===activeBefore,"examinée effacée sans double décrément");
document.querySelector('[data-confidence-score="85"] [data-examine]').click();
check(document.querySelectorAll("[data-delete-item]").length===2,"deux boutons supprimer item");
document.querySelector("[data-delete-item]").click();check(deletionRequest&&deletionRequest.id,"workflow existant appelé");
check(testItems.length===16,"annulation sans modification");
const deletedId=deletionRequest.id;testItems=testItems.filter(i=>i.id!==deletedId);deletionRequest.options.onDeleted({id:deletedId,name:"Produit"});
check(!ExadexAgentsUI._load().audits[0].alerts.some(a=>a.itemIds.includes(deletedId)),"alertes obsolètes retirées");
check(businessWrites===0,"actions locales sans écriture métier");
document.querySelector('[data-agent-action="audit"]').click();
check(!document.querySelector('[name="severity"]'),"filtre gravité supprimé");
check([...document.querySelector('[name="scope"]').options].map(x=>x.value).join(",")==="full,duplicates,stock,references","quatre périmètres seulement");
check(document.querySelector(".audit-explanation").textContent.includes("références non enregistrées dans la fiche du fournisseur correspondant dans Contacts"),"explication audit complet visible");
document.querySelector('[name="scope"]').value="references";document.querySelector('[name="scope"]').dispatchEvent(new Event("change"));
check(document.querySelector(".audit-explanation").textContent.includes("références manquantes")&&document.querySelector(".audit-explanation").textContent.includes("doublons possédant des références différentes")&&document.querySelector(".audit-explanation").textContent.includes("ne sont pas enregistrées"),"définition des trois contrôles visible");
document.querySelector('[name="scope"]').value="stock";document.querySelector('[name="scope"]').dispatchEvent(new Event("change"));
check(document.querySelector(".audit-explanation").textContent.includes("Une quantité de 0 ou un seuil de 0"),"explication mise à jour immédiatement");
document.querySelector('[data-agent-action="home"]').click();
const referenceRecent=[...document.querySelectorAll("[data-open-audit]")].find(button=>button.textContent.includes("Références"));check(referenceRecent.textContent.includes("3 alertes restantes"),"audit récent affiche les alertes restantes");
referenceRecent.click();
check(document.querySelectorAll(".audit-scope-group").length===3,"audit références affiche trois catégories");
check(document.querySelectorAll('.audit-group-toggle[aria-expanded="true"]').length===0&&[...document.querySelectorAll(".audit-group-panel")].every(panel=>panel.hidden),"audit références entièrement fermé à l’ouverture");
check([...document.querySelectorAll(".audit-group-count")].every(badge=>/^\d+ alertes?$/.test(badge.textContent)),"compteurs de catégories au bon format");
const referenceToggles=[...document.querySelectorAll(".audit-group-toggle")],missingToggle=referenceToggles.find(button=>button.textContent.includes("Références manquantes"));missingToggle.click();
check([...document.querySelectorAll(".audit-group-toggle")].find(button=>button.textContent.includes("Références manquantes")).getAttribute("aria-expanded")==="true","deuxième catégorie ouvrable");
[...document.querySelectorAll(".audit-group-toggle")].find(button=>button.textContent.includes("Références manquantes")).click();
check([...document.querySelectorAll(".audit-group-toggle")].find(button=>button.textContent.includes("Références manquantes")).getAttribute("aria-expanded")==="false","deuxième catégorie refermable");
check([...document.querySelectorAll(".audit-group-panel")].every(panel=>panel.hidden)&&!document.querySelector("[data-select-alert]:checked"),"fermer une catégorie masque toutes ses cartes sans sélectionner");
[...document.querySelectorAll(".audit-group-toggle")].find(button=>button.textContent.includes("Doublons avec des références différentes")).click();
[...document.querySelectorAll(".audit-group-toggle")].find(button=>button.textContent.includes("Références non enregistrées")).click();
let selectBoxes=[...document.querySelectorAll("[data-select-alert]")];selectBoxes[0].checked=true;selectBoxes[0].dispatchEvent(new Event("change"));
selectBoxes=[...document.querySelectorAll("[data-select-alert]")];const reviewedBox=selectBoxes.find(box=>box.closest(".audit-alert").classList.contains("reviewed"));reviewedBox.checked=true;reviewedBox.dispatchEvent(new Event("change"));
check(document.querySelector(".audit-bulk-actions").textContent.includes("2 sélectionnées"),"sélection multiple affichée");
check(document.querySelector("[data-bulk-review]").textContent==="Marquer examinées"&&document.querySelector("[data-bulk-clear]").textContent==="Effacer les alertes","libellés groupés exacts");
const remainingBeforeBulk=Number(document.querySelector("#auditRemainingCount").textContent),reviewedBeforeBulk=Number(document.querySelector("#auditReviewedCount").textContent);document.querySelector("[data-bulk-review]").click();
check(Number(document.querySelector("#auditRemainingCount").textContent)===remainingBeforeBulk-1&&Number(document.querySelector("#auditReviewedCount").textContent)===reviewedBeforeBulk+1,"action groupée compte uniquement la nouvelle alerte examinée");
check(!document.querySelector(".audit-bulk-actions"),"sélection vidée après traitement");
document.querySelector('[data-agent-action="home"]').click();
const updatedReferenceRecent=[...document.querySelectorAll("[data-open-audit]")].find(button=>button.textContent.includes("Références"));check(updatedReferenceRecent.textContent.includes("2 alertes restantes"),"audit récent mis à jour immédiatement");
check(ExadexAgentsUI._load().audits.find(a=>a.id==="audit-references-ui").alerts.filter(a=>a.state==="reviewed").length===2,"états examinés persistés après rechargement du stockage");
updatedReferenceRecent.click();
check(Number(document.querySelector("#auditRemainingCount").textContent)===2&&Number(document.querySelector("#auditReviewedCount").textContent)===2,"réouverture conserve les compteurs");
check(document.querySelectorAll('.audit-group-toggle[aria-expanded="true"]').length===0,"catégories refermées lors de la réouverture");
[...document.querySelectorAll(".audit-group-toggle")].find(button=>button.textContent.includes("Références manquantes")).click();
const missingSelect=document.querySelector('.audit-group-panel:not([hidden]) [data-select-alert]');missingSelect.checked=true;missingSelect.dispatchEvent(new Event("change"));
check(document.querySelector(".audit-bulk-actions").textContent.includes("1 sélectionnée"),"sélection individuelle conservée");
document.querySelector("[data-bulk-review]").click();check(Number(document.querySelector("#auditRemainingCount").textContent)===1&&Number(document.querySelector("#auditReviewedCount").textContent)===3,"traitement groupé de catégorie exact");
[...document.querySelectorAll(".audit-group-toggle")].filter(button=>button.getAttribute("aria-expanded")==="false").forEach(button=>button.click());
selectBoxes=[...document.querySelectorAll("[data-select-alert]")].slice(0,2);selectBoxes.forEach(box=>{box.checked=true;box.dispatchEvent(new Event("change"));box=[...document.querySelectorAll("[data-select-alert]")].find(current=>current.dataset.selectAlert===box.dataset.selectAlert)||box;});
check(document.querySelector(".audit-bulk-actions").textContent.includes("2 sélectionnées"),"deux alertes sélectionnées pour effacement");
const deletedBefore=Number(document.querySelector("#auditDeletedCount").textContent);document.querySelector("[data-bulk-clear]").click();
check(confirmation.title.includes("Effacer les 2 alertes sélectionnées"),"confirmation groupée explicite");confirmation.onConfirm();
check(Number(document.querySelector("#auditDeletedCount").textContent)===deletedBefore+2,"effacement groupé incrémente le compteur exact");
check(![...document.querySelectorAll(".audit-live-metrics span")].some(node=>node.textContent==="Conservées"),"libellé Conservées supprimé");
const initialAfterDelete=Number(document.querySelector("#auditInitialCount").textContent),remainingAfterDelete=Number(document.querySelector("#auditRemainingCount").textContent),reviewedAfterDelete=Number(document.querySelector("#auditReviewedCount").textContent),deletedAfterDelete=Number(document.querySelector("#auditDeletedCount").textContent);
check(initialAfterDelete===remainingAfterDelete+reviewedAfterDelete+deletedAfterDelete,"formule des compteurs cohérente après effacement");
check(ExadexAgentsUI._load().audits.find(a=>a.id==="audit-references-ui").deletedAlertCount===deletedAfterDelete,"compteur Effacées persisté après rechargement");
document.querySelector("#result").textContent=`${passed} tests résultats audit réussis.`;
</script></body></html>
