<!doctype html><html lang="fr"><meta charset="utf-8"><title>Validation stock contexte fournisseur</title><body><pre id="result">Tests en cours…</pre><script src="../../js/stock/stock_tracking.js"></script><script src="../../js/agents/scientific_variants.js"></script><script src="../../js/agents/inventory_assistant.js"></script><script src="../../js/agents/assistant_data_sources.js"></script><script src="../../js/agents/transversal_assistant.js"></script><script>
const A=ExadexInventoryAssistant,D=ExadexAssistantDataSources,lines=[];let passed=0;const test=(name,value)=>{lines.push(`${value?'PASS':'FAIL'} ${name}`);if(value)passed++;};
const simple=(id,name,quantity,unit,extra={})=>({id,name,quantity,unit,location:extra.location||'Pièce -80°C → Tiroir n°3',category:extra.category||'Réactifs',manufacturer:extra.manufacturer||'',references:{primary:{reference:extra.reference||id.toUpperCase(),supplier:extra.supplier||''},secondary:[]},stockTracking:{mode:'simple'}}),container=(id,name,count,structured=true)=>({id,name,quantity:count,unit:'bouteilles',location:'Réserve',references:{primary:{reference:id.toUpperCase(),supplier:''},secondary:[]},stockTracking:structured?{mode:'containers',packagingLevels:[{key:'bottle',singular:'bouteille',plural:'bouteilles'},{key:'ml',singular:'mL',plural:'mL',kind:'continuous',contains:500}],trackingUnitKey:'ml',closedByLocation:[{location:'Réserve',quantity:count}]}:{mode:'containers',packagingLevels:[{key:'bottle',singular:'bouteille',plural:'bouteilles'}],closedByLocation:[{location:'Réserve',quantity:count}]}});
const items=[container('dmem-low','DMEM low glucose',2),container('dmem-f12','DMEM/F12 (1:1) W GLUT-I 500ML',7,false),simple('tf','Human transferrin',0,'µL'),simple('ins','Human insulin',0,'mL',{manufacturer:'Thermo Fisher Scientific',supplier:'Lab Distributor'}),simple('dmem-high','DMEM high glucose',3,'bouteilles'),simple('medium','Milieu sans glucose',3,'bouteilles')],contacts=[{id:'lab',company:'Lab Distributor',customerService:'contact@lab.test'},{id:'thermo',company:'Thermo Fisher Scientific',customerService:'contact@thermo.test'}],snapshot=D.snapshot({items,clients:[],clientSamples:[],supplierContacts:contacts,orders:[],locationCatalog:{rooms:[],locations:[],sublocations:[]},history:[],users:[]});
const stock=item=>{const t=StockTracking.normalizeTracking(item),pack=StockTracking.available(item);if(t.mode!=='containers')return{quantity:pack,unit:item.unit,originalQuantity:pack,originalUnit:item.unit,physicalQuantity:pack,physicalUnit:item.unit,convertible:true,display:pack===0?'Stock épuisé':`${pack} ${item.unit}`};const cap=StockTracking.capacity(t),structured=t.packagingLevels.length>1,physical=structured?pack*cap:null,level=StockTracking.trackingLevel(t);return{quantity:physical,unit:structured?level.singular:'',originalQuantity:pack,originalUnit:t.packagingLevels[0].singular,packagingQuantity:pack,packagingDisplay:`${pack} ${t.packagingLevels[0].plural}`,physicalQuantity:physical,physicalUnit:level.singular,unitCapacity:structured?cap:null,conversionSource:structured?'stockTracking.packagingLevels':'unstructured_packaging',convertible:structured,display:structured?`${pack} bouteilles, soit ${physical} ${level.plural}`:`${pack} bouteilles`}};const adapters={stockInfo:stock,stockText:item=>stock(item).display,locationText:item=>item.location};
const zero=A.answer('jai besoin de 300 µL de transferrin et 174 µL de insuline',snapshot,adapters);test('01 zéro insuffisant',zero.evaluations.every(x=>x.status==='insufficient'));test('02 conclusion négative',zero.globalStatus==='negative'&&zero.text.startsWith('Non'));test('03 besoin et manque à zéro',zero.results.every(x=>x.fields.some(f=>f.label==='Besoin')&&x.fields.some(f=>f.label==='Quantité manquante')));
const mix=A.answer('il me faut 1500 mL de DMEM low glucose et 5 L de DMEM/F12',snapshot,adapters);test('04 insuffisant plus inconnu négatif',mix.globalStatus==='negative'&&mix.text.includes('impossible à confirmer'));test('05 besoin toujours affiché',mix.results.every(x=>x.fields.some(f=>f.label==='Besoin')));test('06 capacité nom ignorée',mix.evaluations[1].status==='unknown'&&mix.evaluations[1].row.stockModel.conversionSource==='unstructured_packaging');
const canonical=stock(items[0]);test('07 stock canonique',canonical.packagingQuantity===2&&canonical.physicalQuantity===1000&&canonical.unitCapacity===500);test('08 affichage lié',canonical.display.includes('2 bouteilles')&&canonical.display.includes('1000 mL'));
const presence=A.answer("est-ce que j’ai du DMEM et de l’insuline ?",snapshot,adapters);test('09 groupes séparés',presence.groups.length===2&&presence.groups[0].product.toLowerCase()==='dmem'&&/insuline/i.test(presence.groups[1].product));test('10 ambiguïté locale',presence.groups[0].status==='ambiguous'&&presence.groups[1].status==='insufficient');
const card=A.answer("ouvre la fiche de l’insuline dans l’inventaire",snapshot,adapters),follow=A.answer('Et où est-elle ?',snapshot,adapters,{context:card.context});test('11 fiche met contexte',card.context.lastItemIds.join()==='ins'&&card.context.lastResolvedEntity==='Human insulin');test('12 pronom localisation',follow.text.includes('Pièce -80°C')&&follow.results[0].id==='ins');
const supplier=A.answer("Quel est le fournisseur de l’insuline ?",snapshot,adapters);test('13 fournisseur résout item',supplier.kind==='item_supplier'&&supplier.text.includes('Lab Distributor'));test('14 fabricant distinct',supplier.results[0].fields.some(f=>f.label==='Fabricant')&&supplier.results[0].fields.some(f=>f.label.includes('Fournisseur')));
const heparin=A.answer("Je cherche de l’héparine.",snapshot,adapters);test('15 recherche naturelle inventaire',heparin.analysis.domain==='inventory');test('16 absence cite entité',heparin.text.includes('« héparine »')&&!heparin.text.includes('Je cherche'));
const glucose=A.answer('Avons-nous du glucose ?',snapshot,adapters);test('17 glucose non assimilé au milieu',glucose.results.length===0||glucose.results.every(r=>r.relation==='secondary'));const before=JSON.stringify(items);A.answer('Et son stock ?',snapshot,adapters,{context:card.context});test('18 lecture seule',before===JSON.stringify(items));
document.querySelector('#result').textContent=lines.join('\n')+`\n${passed}/18 tests passed`;document.title=passed===18?'PASS':'FAIL';document.body.dataset.failed=String(passed!==18);
</script></body></html>
