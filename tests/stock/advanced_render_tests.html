<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests rendu avancé</title><link rel="stylesheet" href="../../assets/css/design.css"><body><pre id="result">Tests en cours…</pre><main id="visualFixture"></main><iframe id="appFrame" hidden></iframe><script>
const results=[],consoleErrors=[];const assert=(condition,message)=>{if(!condition)throw new Error(message)};const test=(name,fn)=>{try{fn();results.push(`✓ ${name}`)}catch(error){results.push(`✗ ${name}: ${error.message}`)}};const frame=document.querySelector("#appFrame");frame.contentWindow.addEventListener("error",event=>consoleErrors.push(event.message));frame.addEventListener("load",()=>{const app=frame.contentWindow;

test("aliquote ouverte rendue individuellement",()=>{const item=JSON.parse(JSON.stringify(advanced));item.aliquotTracking={enabled:true,preparations:[{id:"p-open",label:"Préparation nº1",createdCount:20,representedSourceQuantity:.5,sourceUnit:"mg",volume:50,volumeUnit:"µL",concentration:.5,concentrationUnit:"mM",preparedAt:"2026-07-17",preparedBy:{userName:"Caroline",userEmoji:"🧪"},locations:[{location:"Bureau",quantity:16}],openAliquots:[{id:"oa1",label:"Aliquote nº1",preparationId:"p-open",location:"Bureau",initialVolume:50,remainingVolume:20,volumeUnit:"µL",sourceEquivalentInitial:.025,sourceEquivalentRemaining:.01,openedAt:"2026-07-17T10:42:00+02:00",openedBy:{userName:"Caroline",userEmoji:"🧪"},status:"open",version:1}],status:"active",version:2}]};const html=app.renderAdvancedStockDetail(item);assert(html.includes("16 aliquotes non ouvertes · 1 aliquote ouverte"),"compteurs");assert(html.includes("Aliquote nº1")&&html.includes("20 µL restants")&&html.includes("Ouverte par")&&html.includes("17 juillet 2026 à 10:42"),"carte ouverte")});

test("matrice indépendante des huit modules",()=>{const expected=[[false,false,false,false,false,false],[true,false,false,true,false,false],[false,true,false,false,false,true],[false,false,true,false,true,false],[true,true,false,true,false,true],[true,false,true,true,true,false],[false,true,true,false,true,true],[true,true,true,true,true,true]];expected.forEach(([packaging,traceability,aliquot,distributionVisible,preparationsVisible,journalVisible],index)=>{const item={id:`matrix-${index}`,name:"Matrice",quantity:1.5,minStock:0,unit:"mg",stockTracking:{mode:packaging?"containers":"simple",traceabilityMode:traceability?"detailed":"periodic",packagingLevels:[{singular:"flacon",plural:"flacons",contains:1},{singular:"mg",plural:"mg",kind:"continuous",contains:1}],trackingUnitKey:"mg",closedByLocation:[],openContainers:[]},aliquotTracking:{enabled:aliquot,preparations:[]}},html=app.renderAdvancedStockDetail(item);assert(html.includes("Répartition du stock")===distributionVisible,`combinaison ${index+1}: répartition`);assert(html.includes("Préparations et aliquotes")===preparationsVisible,`combinaison ${index+1}: préparations`);assert(html.includes("Journal des mouvements")===journalVisible,`combinaison ${index+1}: journal`);if(!packaging)assert(!html.includes("Stock fermé")&&!html.includes("Aucun contenant fermé"),`combinaison ${index+1}: état conteneur artificiel`);if(distributionVisible&&preparationsVisible)assert(html.indexOf("Répartition du stock")<html.indexOf("Préparations et aliquotes"),"ordre répartition/préparations");if(preparationsVisible&&journalVisible)assert(html.indexOf("Préparations et aliquotes")<html.indexOf("Journal des mouvements"),"ordre préparations/journal")})});
test("aliquotes seules conservent le stock global",()=>{const item={id:"aliquot-only",quantity:1.5,minStock:0,unit:"mg",stockTracking:{mode:"simple",traceabilityMode:"periodic"},aliquotTracking:{enabled:true,preparations:[]}},html=app.renderAdvancedStockDetail(item);assert(app.StockTracking.available(item)===1.5,"quantité globale modifiée");assert(html.includes("Aucune préparation active.")&&html.includes("Préparer des aliquotes"),"état vide/action");assert(!html.includes("Répartition du stock")&&!html.includes("Journal des mouvements"),"modules parasites")});
test("actions compatibles avec les modules actifs",()=>{const simpleAliquot={quantity:1,unit:"mg",stockTracking:{mode:"simple",traceabilityMode:"periodic"},aliquotTracking:{enabled:true,preparations:[]}},simpleTrace={quantity:1,unit:"mg",stockTracking:{mode:"simple",traceabilityMode:"detailed"},aliquotTracking:{enabled:false,preparations:[]}},containers={quantity:1,unit:"carton",stockTracking:{mode:"containers",traceabilityMode:"periodic",packagingLevels:[{singular:"carton",plural:"cartons"},{singular:"sachet",plural:"sachets",contains:10}],trackingUnitKey:"sachet"},aliquotTracking:{enabled:false,preparations:[]}},values=item=>app.getStockManagerActionState(item).actions.map(action=>action[0]);assert(values(simpleAliquot).includes("aliquots_prepared")&&!values(simpleAliquot).includes("container_opened"),"aliquotes seules");assert(values(simpleTrace).includes("consumed")&&!values(simpleTrace).includes("aliquots_prepared")&&!values(simpleTrace).includes("container_opened"),"traçabilité globale");assert(values(containers).includes("container_opened")&&!values(containers).includes("aliquots_prepared"),"conditionnement seul")});
test("source globale sans selects techniques",()=>{const simple={id:"tgfb1",quantity:1.5,unit:"g",location:"−20 °C gris labo",locations:["−20 °C gris labo"],stockTracking:{mode:"simple"},aliquotTracking:{enabled:true,preparations:[]}},html=app.renderAliquotPreparationFields(simple,[["−20 °C gris labo","−20 °C gris labo"]]);assert(html.includes("Source utilisée")&&html.includes("Stock disponible")&&html.includes("1,5 g · −20 °C gris labo"),"résumé source");assert(!html.includes("Contenant source")&&!html.includes("Stock simple"),"select technique visible");assert(html.includes('max="1.5"'),"maximum absent")});
test("quantité représentée masquée et automatique",()=>{const simple={id:"auto-equivalent",quantity:1.5,unit:"g",stockTracking:{mode:"simple"},aliquotTracking:{enabled:true,preparations:[]}},host=app.document.createElement("div");host.innerHTML=app.renderAliquotPreparationFields(simple,[["Bureau","Bureau"]]);assert(!host.querySelector("#smRepresented")&&!host.textContent.includes("Quantité source représentée"),"ancien champ visible");host.querySelector("#smSourceQuantity").value="0.5";host.querySelector("#smCreated").value="20";host.querySelector("#smTo").value="Bureau";host.querySelector("#smLocationQuantity").value="20";const operation=app.buildAliquotPreparationOperation(host,simple);assert(operation.sourceQuantity===.5&&operation.representedSourceQuantity===.5,"équivalence non recopiée");assert(operation.locations.length===1&&operation.locations[0].quantity===20,"répartition simple")});
test("ajout et retrait de la seconde localisation",()=>{const simple={quantity:1.5,unit:"g",stockTracking:{mode:"simple"},aliquotTracking:{enabled:true,preparations:[]}},host=app.document.createElement("div");host.innerHTML=app.renderAliquotPreparationFields(simple,[["Bureau","Bureau"],["Congélateur −80 °C","Congélateur −80 °C"],["Culture L2","Culture L2"]])+`<p id="stockManagerError" class="hidden"></p>`;const row=host.querySelector("#additionalAliquotLocationRow"),location=host.querySelector("#smTo2"),quantity=host.querySelector("#smLocationQuantity2");app.setAdditionalAliquotLocationVisible(host,false);assert(row.classList.contains("hidden")&&location.disabled&&quantity.disabled&&!location.required&&!quantity.required,"champs cachés actifs");app.setAdditionalAliquotLocationVisible(host,true);assert(!row.classList.contains("hidden")&&!location.disabled&&!quantity.disabled&&location.required&&quantity.required,"seconde ligne inactive");location.value="Culture L2";quantity.value="8";app.setAdditionalAliquotLocationVisible(host,false);assert(location.value===""&&quantity.value===""&&location.disabled&&quantity.disabled,"valeurs cachées conservées")});
test("messages de répartition inférieure et supérieure",()=>{const simple={quantity:1.5,unit:"g",stockTracking:{mode:"simple"},aliquotTracking:{enabled:true,preparations:[]}},host=app.document.createElement("div");host.innerHTML=app.renderAliquotPreparationFields(simple,[["Bureau","Bureau"],["Culture L2","Culture L2"]])+`<p id="stockManagerError" class="hidden"></p>`;app.setAdditionalAliquotLocationVisible(host,false);host.querySelector("#smCreated").value="20";host.querySelector("#smTo").value="Bureau";host.querySelector("#smLocationQuantity").value="17";const belowValid=app.validateAliquotDistribution(host),below=host.querySelector("#stockManagerError").textContent;assert(!belowValid&&/reste\s+3\s+aliquotes/.test(below),below||"reste non indiqué");host.querySelector("#smLocationQuantity").value="22";const aboveValid=app.validateAliquotDistribution(host),above=host.querySelector("#stockManagerError").textContent;assert(!aboveValid&&/dépasse de\s+2\s+aliquotes/.test(above),above||"dépassement non indiqué")});
test("deux localisations totalisent vingt",()=>{const simple={quantity:1.5,unit:"g",stockTracking:{mode:"simple"},aliquotTracking:{enabled:true,preparations:[]}},host=app.document.createElement("div");host.innerHTML=app.renderAliquotPreparationFields(simple,[["Congélateur −80 °C","Congélateur −80 °C"],["Culture L2","Culture L2"]])+`<p id="stockManagerError" class="hidden"></p>`;app.setAdditionalAliquotLocationVisible(host,true);host.querySelector("#smCreated").value="20";host.querySelector("#smTo").value="Congélateur −80 °C";host.querySelector("#smLocationQuantity").value="12";host.querySelector("#smTo2").value="Culture L2";host.querySelector("#smLocationQuantity2").value="8";assert(app.validateAliquotDistribution(host),"12 + 8 refusé");const operation=app.buildAliquotPreparationOperation(host,simple);assert(operation.locations.length===2&&operation.locations.reduce((sum,row)=>sum+row.quantity,0)===20,"deuxième localisation perdue")});
test("sources containers filtrées",()=>{const sources=app.getAliquotPreparationSources({quantity:0,unit:"cartons",stockTracking:{mode:"containers",packagingLevels:[{singular:"carton",plural:"cartons",contains:1},{singular:"sachet",plural:"sachets",contains:10}],trackingUnitKey:"sachet",closedByLocation:[{location:"Réserve",quantity:2}],openContainers:[{id:"vide",remaining:0,status:"open"},{id:"plein",label:"carton ouvert nº2",location:"L2",remaining:3,capacity:10,status:"open"}]},aliquotTracking:{enabled:true,preparations:[]}});assert(sources.groups.length===2,"catégories valides absentes");assert(sources.groups[0].sources.length===1&&sources.groups[0].sources[0].label.includes("3 sachets · L2"),"contenants ouverts non filtrés");assert(sources.groups[1].sources[0].label.includes("Réserve · 2 cartons fermés"),"stock fermé absent")});
test("aucune source affiche un état explicite",()=>{const html=app.renderAliquotPreparationFields({quantity:0,unit:"g",stockTracking:{mode:"simple"},aliquotTracking:{enabled:true,preparations:[]}},[["L1","L1"]]);assert(html.includes("Aucun stock disponible")&&!html.includes('id="smSourceId"'),"état vide incorrect")});

const visual={id:"visual",name:"Falcon 50",minStock:2,unit:"cartons",stockTracking:{mode:"containers",packagingLevels:[{singular:"carton",plural:"cartons",contains:1},{singular:"sachet",plural:"sachets",contains:10}],trackingUnitKey:"sachet",closedByLocation:[{location:"Réserve",quantity:5}],openContainers:[{id:"open-1",label:"carton ouvert nº1",location:"Réserve",remaining:8,capacity:10,status:"open",openedAt:"2026-07-17T13:53:00+02:00",openedBy:{userName:"Caroline",userEmoji:"🧪"}}]},aliquotTracking:{enabled:false,preparations:[]}};

test("plusieurs localisations et trois ouverts",()=>{const many=JSON.parse(JSON.stringify(visual));many.stockTracking.closedByLocation=[{location:"Réserve",quantity:3},{location:"Culture L2",quantity:2}];many.stockTracking.openContainers=[1,2,3].map((n,index)=>({id:`o${n}`,label:`carton ouvert nº${n}`,location:index===2?"":"Réserve",remaining:10-n,capacity:10,status:"open",openedBy:index===1?{userName:"Julien",userInitials:"JU"}:{userName:"Caroline",userEmoji:"🧪"}}));const html=app.renderAdvancedStockDetail(many);assert((html.match(/stock-distribution-card--closed/g)||[]).length===2,"deux stocks fermés");assert((html.match(/stock-distribution-card--open/g)||[]).length===3,"trois ouverts");assert(html.includes("Culture L2")&&html.includes("Date inconnue")&&html.includes("⌖</span>—"),"valeurs manquantes")});
document.querySelector("#visualFixture").innerHTML=app.renderAdvancedStockDetail(visual);test("aucun débordement horizontal des cartes",()=>assert([...document.querySelectorAll(".stock-distribution-card")].every(card=>card.scrollWidth<=card.clientWidth+1),"débordement"));
