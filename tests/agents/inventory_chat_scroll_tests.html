<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests scroll chat</title><body><pre id="result">Tests en cours…</pre>
<iframe id="appFrame" style="position:fixed;inset:0;width:1400px;height:900px;opacity:.01;pointer-events:none"></iframe>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms)),frame=document.querySelector('#appFrame'),lines=[];let passed=0;
const test=(name,value)=>{lines.push(`${value?'PASS':'FAIL'} ${name}`);if(value)passed++;};
const forceVisible=setInterval(()=>{const d=frame.contentDocument;d?.querySelector('#app')?.classList.remove('hidden');d?.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view.id==='agentsView'));if(d&&!d.querySelector('#scroll-test-style')){const style=d.createElement('style');style.id='scroll-test-style';style.textContent='#app{display:grid!important}#agentsView{display:block!important}.inventory-chat-messages{height:360px!important;max-height:360px!important}';d.head.append(style);}},50);
frame.addEventListener('load',async()=>{const w=frame.contentWindow,d=frame.contentDocument,item=(id,name)=>({id,name,quantity:1000,unit:'mL',location:'Frigo',references:{primary:{reference:id,supplier:''},secondary:[]},stockTracking:{mode:'simple'}}),source=w.ExadexAssistantDataSources.snapshot({items:[item('dmem','DMEM low glucose'),item('dmem2','DMEM high glucose'),item('ins','Insulin')],clients:[],clientSamples:[],supplierContacts:[],orders:[],locationCatalog:{rooms:[],locations:[],sublocations:[]},history:[],users:[]});w.ExadexAssistantDataSources.snapshot=()=>source;d.querySelector('#nameInput').value='Scroll';d.querySelector('#loginForm').requestSubmit();await wait(1800);d.querySelector('[data-view="agents"]').click();await wait(100);[...d.querySelectorAll('.agent-card')].find(card=>card.textContent.includes('Assistant Inventaire'))?.querySelector('button').click();await wait(1200);const ui=w.ExadexAgentsUI,send=async text=>{ui.sendAssistantQuestion(text);await wait(1550);};for(let i=0;i<8;i++)await send(i%2?'jai du dmem ?':'bonjour');let box=d.querySelector('#inventoryChatMessages');box.scrollTop=box.scrollHeight;ui.clearAssistantScrollTrace();const pageBefore=w.scrollY;await send('jai du dmem et de l’insuline ?');let trace=ui.assistantScrollTrace(),values=trace.map(x=>x.after);test('01 jamais zéro en bas',values.length>=2&&values.every(value=>value>0));test('02 message utilisateur stable',trace[0]?.wasNearBottom===true);test('03 indicateur stable',trace.some(x=>x.phase==='pending'));test('04 remplacement stable',trace.some(x=>x.phase==='settled'));test('05 cartes restent en bas',trace.at(-1)?.after>0);test('06 avatars sans saut',!values.includes(0));test('07 focus sans scroll',d.activeElement?.id==='inventoryChatInput');test('08 page stable',w.scrollY===pageBefore&&trace.every(x=>x.windowAfter===x.windowBefore));box=d.querySelector('#inventoryChatMessages');test('09 seul chat défile',box.scrollTop>0&&w.scrollY===pageBefore);box.scrollTop=Math.max(20,box.scrollHeight-box.clientHeight-180);const readingTop=box.scrollTop;ui.clearAssistantScrollTrace();await send('bonjour');trace=ui.assistantScrollTrace();test('10 lecteur ancien ancré',trace[0]?.wasNearBottom===false);test('11 pas forcé en bas',trace.every(x=>x.wasNearBottom===false));test('12 suppression indicateur ancrée',trace.at(-1)?.after>=readingTop);test('13 aucun double saut',!trace.some(x=>x.after===0));test('14 mouvement réduit',w.getComputedStyle(d.querySelector('#inventoryChatMessages')).scrollBehavior==='auto');test('15 phases intermédiaires observées',trace.length>=2&&trace.every(x=>Number.isFinite(x.before)&&Number.isFinite(x.after)&&Number.isFinite(x.scrollHeight)));frame.style.width='390px';await wait(200);box=d.querySelector('#inventoryChatMessages');test('16 mobile interne',box.clientWidth<=390&&w.getComputedStyle(box).overflowY==='auto');clearInterval(forceVisible);document.querySelector('#result').textContent=lines.join('\n')+`\n${passed}/16 tests passed\n`+JSON.stringify(trace,null,2);document.title=passed===16?'PASS':'FAIL';document.body.dataset.failed=String(passed!==16);w.stop();});frame.src='../../index.html';
</script></body></html>
