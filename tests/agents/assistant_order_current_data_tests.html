<!doctype html><html lang="fr"><meta charset="utf-8"><title>Commandes — données actuelles</title><body><pre id="result">Chargement…</pre><script src="../../js/stock/stock_tracking.js"></script><script src="../../js/agents/inventory_assistant.js"></script><script src="../../js/agents/assistant_data_sources.js"></script><script src="../../js/agents/transversal_assistant.js"></script><script>
(async()=>{const raw=await fetch("../../shared_data.json").then(r=>r.json()),copy=JSON.parse(JSON.stringify(raw)),snapshot=ExadexAssistantDataSources.snapshot({items:copy.inventoryItems,orders:copy.orders,clients:copy.clients,clientSamples:copy.clientSamples,supplierContacts:copy.supplierContacts,locationCatalog:copy.locationCatalog,history:copy.history,users:[]}),questions=["est ce que on a commandé du qiazol recement ?","et du luminex ?","est ce que on a commandé un luminex récement ?","estc eque on a commandé du endothelail cell growth medium recement ?"],reports=[];let context={};for(const question of questions){const response=ExadexInventoryAssistant.answer(question,snapshot,{}, {context});context=response.context;reports.push({question,intent:response.analysis.intent,product:response.analysis.orderQuery?.product,domains:response.analysis.domains,results:response.results.map(row=>({id:row.id,name:row.name,status:row.status,navigation:row.navigation,matches:row.matchDetails,date:row.fields.find(f=>f.label==="Date")?.value})),answer:response.text});}const unchanged=JSON.stringify(raw)===JSON.stringify(copy);document.querySelector("#result").textContent=JSON.stringify({orderCount:snapshot.orders.length,unchanged,reports},null,2);document.title=unchanged&&reports[1].results.length===2&&reports[2].results.length===2&&reports[3].results.length===2&&reports[0].results.length===0?"PASS":"FAIL";document.body.dataset.failed=String(document.title!=="PASS");})();
