<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests stockage GitHub</title><body><pre id="result">Tests en cours…</pre><script>
window.EXADEX_GITHUB_STORAGE={owner:"test",repo:"test",branch:"main",path:"shared_data.json",token:"token"};
const encode=value=>btoa(unescape(encodeURIComponent(JSON.stringify(value))));
let remote={version:1,inventoryItems:[],stockMovements:[]},sha="sha-1",putCount=0,getCount=0;
window.fetch=async(url,options={})=>{if(!options.method){getCount++;return{ok:true,status:200,json:async()=>({sha,content:encode(remote)})}}putCount++;if(putCount===1)return{ok:false,status:409,json:async()=>({})};const body=JSON.parse(options.body);remote=JSON.parse(decodeURIComponent(escape(atob(body.content))));sha=`sha-${putCount+1}`;return{ok:true,status:200,json:async()=>({content:{sha}})}};
</script><script src="../../js/storage/github_storage.js"></script><script>
(async()=>{const lines=[];const assert=(condition,message)=>{if(!condition)throw new Error(message)};try{const result=await ExadexGithubStorage.mutateSharedData("op-409",data=>{data.stockMovements.push({operationId:"op-409"});return data});assert(putCount===2,"retry PUT attendu");assert(getCount>=2,"rechargement après 409 attendu");assert(result.data.stockMovements.length===1,"mutation unique");lines.push("✓ conflit 409 rechargé et rejoué");const duplicate=await ExadexGithubStorage.mutateSharedData("op-409",data=>{data.stockMovements.push({operationId:"op-409"});return data});assert(duplicate.duplicate,"opération reconnue");assert(duplicate.data.stockMovements.length===1,"double clic dédupliqué");lines.push("✓ operationId empêche le double clic");}catch(error){lines.push(`✗ ${error.message}`)}document.querySelector("#result").textContent=lines.join("\n");document.body.dataset.failed=String(lines.some(line=>line.startsWith("✗")))})();
</script></body></html>
