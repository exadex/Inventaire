<!doctype html><html lang="fr"><meta charset="utf-8"><title>Automatisation contenants</title><pre id="result"></pre>
<script src="../../js/stock/stock_tracking.js"></script><script>
const lines=[],test=(n,f)=>{try{f();lines.push(`✓ ${n}`)}catch(e){lines.push(`✗ ${n}: ${e.message}`)}},ok=(v,m)=>{if(!v)throw new Error(m)};
const base=()=>({id:"i",name:"Test",quantity:2,unit:"cartons",stockTracking:{mode:"containers",traceabilityMode:"detailed",packagingLevels:[{singular:"carton",plural:"cartons",contains:1},{singular:"sachet",plural:"sachets",contains:10}],trackingUnitKey:"sachet",closedByLocation:[{location:"Réserve",quantity:2}],openContainers:[]},aliquotTracking:{enabled:false,preparations:[]}});
const op=(extra={})=>({operationId:StockTracking.id("op"),type:"consumed",entityType:"containers_auto",quantity:extra.quantity,...extra});
test("ouverture automatique puis utilisation",()=>{const r=StockTracking.apply(base(),op({quantity:3}),{name:"Caroline"});const c=r.item.stockTracking.openContainers[0];ok(c.remaining===7&&r.item.stockTracking.closedByLocation[0].quantity===1,"stock incorrect");ok(r.event.automaticOpen&&r.event.containerTransitions.length===2,"trace absente")});
test("fin automatique",()=>{let item=StockTracking.apply(base(),op({quantity:3}),{name:"Caroline"}).item;const c=item.stockTracking.openContainers[0];const r=StockTracking.apply(item,op({quantity:7,entityId:c.id}),{name:"Caroline"});ok(r.item.stockTracking.openContainers[0].status==="finished","statut incorrect");ok(r.event.automaticFinish,"trace absente")});
test("traversée de plusieurs contenants",()=>{const r=StockTracking.apply(base(),op({quantity:15}),{name:"Caroline"});ok(r.item.stockTracking.openContainers.length===2,"deux contenants attendus");ok(r.item.stockTracking.openContainers[0].status==="finished"&&r.item.stockTracking.openContainers[1].remaining===5,"transition incorrecte")});
test("absence de stock bloquée sans mutation",()=>{const item=base();item.stockTracking.closedByLocation=[];const before=JSON.stringify(item);let blocked=false;try{StockTracking.apply(item,op({quantity:1}),{name:"Caroline"})}catch{blocked=true}ok(blocked&&JSON.stringify(item)===before,"mutation partielle")});
test("comptage fermé conserve le statut",()=>{const r=StockTracking.apply(base(),{operationId:StockTracking.id("op"),type:"recounted",entityType:"closed",fromLocation:"Réserve",quantity:1},{name:"Caroline"});ok(r.item.stockTracking.closedByLocation[0].quantity===1&&r.event.containerStatusAfter==="closed","comptage incorrect")});
test("deux fermés matérialisés individuellement",()=>{const tracking=StockTracking.normalizeTracking(base());ok(tracking.closedContainers.length===2&&tracking.closedContainers[0].id!==tracking.closedContainers[1].id,"identifiants absents")});
test("modifier uniquement le deuxième fermé",()=>{const item=base(),tracking=StockTracking.normalizeTracking(item),second=tracking.closedContainers[1],r=StockTracking.apply(item,{operationId:"count-one",type:"containers_recounted",changes:[{containerId:second.id,expectedVersion:second.version,status:"closed",unitKey:"sachet",location:"Laboratoire",quantity:8}]},{name:"Caroline"}),closed=r.item.stockTracking.closedContainers;ok(closed.find(row=>row.id===tracking.closedContainers[0].id).remaining===10,"premier modifié");ok(closed.find(row=>row.id===second.id).remaining===8&&closed.find(row=>row.id===second.id).location==="Laboratoire","deuxième incorrect");ok(r.events.length===1,"mouvement ambigu")});
test("modifier uniquement le statut conserve les autres valeurs",()=>{const item=base(),tracking=StockTracking.normalizeTracking(item),target=tracking.closedContainers[1],other=tracking.closedContainers[0],r=StockTracking.apply(item,{operationId:"status-only",type:"containers_recounted",changes:[{containerId:target.id,expectedVersion:target.version,status:"open",unitKey:target.unitKey,location:target.location,quantity:10,capacity:10}]},{name:"Caroline"}),changed=r.item.stockTracking.openContainers.find(row=>row.id===target.id),untouched=r.item.stockTracking.closedContainers.find(row=>row.id===other.id);ok(changed&&changed.status==="open"&&changed.remaining===10&&changed.capacity===10&&changed.location===target.location,"statut non persisté");ok(JSON.stringify(untouched)===JSON.stringify(other),"autre contenant modifié")});
test("modifier uniquement l’unité applique la conversion fiable",()=>{const item=base(),tracking=StockTracking.normalizeTracking(item),target=tracking.closedContainers[1],r=StockTracking.apply(item,{operationId:"unit-only",type:"containers_recounted",changes:[{containerId:target.id,expectedVersion:target.version,status:"closed",unitKey:"carton",location:target.location,quantity:1,capacity:1}]},{name:"Caroline"}),changed=r.item.stockTracking.closedContainers.find(row=>row.id===target.id);ok(changed.unitKey==="carton"&&changed.remaining===10&&changed.capacity===10,"unité non persistée ou conversion incorrecte")});
test("unité incompatible refusée",()=>{const item=base(),tracking=StockTracking.normalizeTracking(item),target=tracking.closedContainers[0];let blocked=false;try{StockTracking.apply(item,{operationId:"bad-unit",type:"containers_recounted",changes:[{containerId:target.id,status:"closed",unitKey:"litre",location:target.location,quantity:1,capacity:1}]},{name:"Caroline"})}catch{blocked=true}ok(blocked,"unité incompatible acceptée")});
test("modifier uniquement quantité recalcule le total",()=>{const item=base(),tracking=StockTracking.normalizeTracking(item),target=tracking.closedContainers[1],r=StockTracking.apply(item,{operationId:"quantity-only",type:"containers_recounted",changes:[{containerId:target.id,status:"closed",unitKey:"sachet",location:target.location,quantity:8,capacity:10}]},{name:"Caroline"});ok(r.item.stockTracking.closedContainers.find(row=>row.id===target.id).remaining===8&&Math.abs(r.item.quantity-1.8)<1e-9,"quantité ou total incorrect")});
test("modifier uniquement capacité conserve la quantité",()=>{const item=base(),tracking=StockTracking.normalizeTracking(item),target=tracking.closedContainers[1],r=StockTracking.apply(item,{operationId:"capacity-only",type:"containers_recounted",changes:[{containerId:target.id,status:"closed",unitKey:"sachet",location:target.location,quantity:10,capacity:12}]},{name:"Caroline"}),changed=r.item.stockTracking.closedContainers.find(row=>row.id===target.id);ok(changed.capacity===12&&changed.remaining===10,"capacité non persistée")});
test("quantité supérieure à capacité refusée",()=>{const item=base(),tracking=StockTracking.normalizeTracking(item),target=tracking.closedContainers[0];let blocked=false;try{StockTracking.apply(item,{operationId:"bad-capacity",type:"containers_recounted",changes:[{containerId:target.id,status:"closed",unitKey:"sachet",location:target.location,quantity:11,capacity:10}]},{name:"Caroline"})}catch{blocked=true}ok(blocked,"quantité incohérente acceptée")});
test("plusieurs paramètres d’un même contenant sont atomiques",()=>{const item=base(),tracking=StockTracking.normalizeTracking(item),target=tracking.closedContainers[1],other=tracking.closedContainers[0],r=StockTracking.apply(item,{operationId:"multi-fields",type:"containers_recounted",changes:[{containerId:target.id,status:"open",unitKey:"sachet",location:"Laboratoire",quantity:7,capacity:12}]},{name:"Caroline"}),changed=r.item.stockTracking.openContainers.find(row=>row.id===target.id);ok(changed&&changed.status==="open"&&changed.unitKey==="sachet"&&changed.location==="Laboratoire"&&changed.remaining===7&&changed.capacity===12,"modifications groupées incorrectes");ok(JSON.stringify(r.item.stockTracking.closedContainers.find(row=>row.id===other.id))===JSON.stringify(other),"contenant voisin modifié");ok(r.events.length===1&&r.events[0].beforeCapacity===10&&r.events[0].afterCapacity===12,"traçabilité incomplète")});
test("comptage ouvert recalcule le total",()=>{let item=StockTracking.apply(base(),op({quantity:2}),{name:"Caroline"}).item,open=item.stockTracking.openContainers[0],r=StockTracking.apply(item,{operationId:"count-open",type:"containers_recounted",changes:[{containerId:open.id,expectedVersion:open.version,status:"open",unitKey:"sachet",location:open.location,quantity:6}]},{name:"Caroline"});ok(r.item.stockTracking.openContainers[0].remaining===6,"reste incorrect");ok(Math.abs(r.item.quantity-1.6)<1e-9,`total ${r.item.quantity}`)});
test("statut terminé exige zéro",()=>{let item=StockTracking.apply(base(),op({quantity:2}),{name:"Caroline"}).item,open=item.stockTracking.openContainers[0],blocked=false;try{StockTracking.apply(item,{operationId:"finish-bad",type:"containers_recounted",changes:[{containerId:open.id,status:"finished",unitKey:"sachet",location:open.location,quantity:1}]},{name:"Caroline"})}catch{blocked=true}ok(blocked,"transition invalide acceptée")});
test("ajout multiple crée des contenants primaires distincts",()=>{const before=base(),tracking=StockTracking.normalizeTracking(before),changes=[1,2,3].map(index=>({containerId:`draft-${index}`,isNew:true,status:"closed",unitKey:"carton",location:"Réserve",quantity:1})),r=StockTracking.apply(before,{operationId:"add-three",type:"containers_recounted",changes},{name:"Caroline"}),created=r.item.stockTracking.closedContainers.filter(row=>!tracking.closedContainers.some(old=>old.id===row.id));ok(created.length===3&&new Set(created.map(row=>row.id)).size===3,"contenants distincts absents");ok(created.every(row=>row.status==="closed"&&row.location==="Réserve"&&row.remaining===10),"valeurs automatiques incorrectes");ok(r.item.quantity===5,"total non recalculé");ok(r.events.length===3&&new Set(r.events.map(event=>event.operationId)).size===3,"mouvements non distincts")});
test("nouveau contenant persiste tous les paramètres choisis",()=>{const r=StockTracking.apply(base(),{operationId:"new-edited",type:"containers_recounted",changes:[{containerId:"draft-edited",isNew:true,status:"open",unitKey:"sachet",location:"Laboratoire",quantity:8,capacity:12}]},{name:"Caroline"}),created=r.item.stockTracking.openContainers.find(row=>row.location==="Laboratoire");ok(created&&created.id!=="draft-edited"&&created.status==="open"&&created.unitKey==="sachet"&&created.remaining===8&&created.capacity===12,"nouveau contenant incomplet")});
test("ajout multiple survit à la sérialisation",()=>{const changes=[1,2].map(index=>({containerId:`draft-persist-${index}`,isNew:true,status:"closed",unitKey:"carton",location:"Réserve",quantity:1})),saved=StockTracking.apply(base(),{operationId:"add-persist",type:"containers_recounted",changes},{name:"Caroline"}).item,reloaded=StockTracking.normalizeTracking(JSON.parse(JSON.stringify(saved)));ok(reloaded.closedContainers.length===4&&reloaded.closedContainers.every(row=>row.id),"persistance des ajouts incorrecte");ok(reloaded.closedByLocation[0].quantity===4&&reloaded.closedByLocation[0].location==="Réserve","résumé fermé incorrect")});
test("nouveau contenant exige une localisation",()=>{let blocked=false;try{StockTracking.apply(base(),{operationId:"add-without-location",type:"containers_recounted",changes:[{containerId:"draft-empty",isNew:true,status:"closed",unitKey:"carton",location:"",quantity:1}]},{name:"Caroline"})}catch{blocked=true}ok(blocked,"ajout sans localisation accepté")});
test("identifiants et quantités survivent à la sérialisation",()=>{const tracking=StockTracking.normalizeTracking(base()),second=tracking.closedContainers[1],saved=StockTracking.apply(base(),{operationId:"persist-count",type:"containers_recounted",changes:[{containerId:second.id,status:"closed",unitKey:"sachet",location:"Réserve",quantity:8}]},{name:"Caroline"}).item,reloaded=StockTracking.normalizeTracking(JSON.parse(JSON.stringify(saved))),same=reloaded.closedContainers.find(row=>row.id===second.id);ok(same&&same.remaining===8&&reloaded.closedContainers.length===2,"persistance incorrecte")});
document.querySelector("#result").textContent=lines.join("\n");document.body.dataset.failed=String(lines.some(x=>x.startsWith("✗")));
</script></html>
