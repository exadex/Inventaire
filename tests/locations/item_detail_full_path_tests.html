<!doctype html><html lang="fr"><meta charset="utf-8"><title>Test chemin fiche item</title><body><pre id="result">Test en cours…</pre><iframe id="appFrame" style="position:absolute;left:-10000px;width:1200px;height:800px"></iframe><script>
document.querySelector("#appFrame").addEventListener("load",()=>setTimeout(()=>{const w=document.querySelector("#appFrame").contentWindow,catalog=w.ExadexLocations.catalog(),rooms=w.ExadexLocations.rooms(),sub=catalog.sublocations[0],location=catalog.locations.find(row=>row.id===sub?.locationId),room=rooms.find(row=>row.id===location?.roomId);if(!sub||!location||!room)throw new Error("Fixture hiérarchique indisponible");const item={id:"fixture-path",name:"Fixture",category:"Test",quantity:1,unit:"u",minStock:0,placements:[{roomId:room.id,locationId:location.id,sublocationId:sub.id}],references:{primary:{},secondary:[]}};const html=w.renderInventoryDetail(item),expected=`${room.name} → ${location.name} → ${sub.name}`,passed=html.includes(expected);document.querySelector("#result").textContent=`${passed?"PASS":"FAIL"} chemin complet : ${expected}`;document.title=passed?"PASS":"FAIL";document.body.dataset.failed=String(!passed);w.stop();},900));
document.querySelector("#appFrame").src="../../index.html";
</script></body></html>
