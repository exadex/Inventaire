<!doctype html><html lang="fr"><meta charset="utf-8"><title>UI commandes Assistant</title><body><pre id="result">Tests en cours…</pre><iframe id="appFrame" style="position:absolute;left:-10000px;width:1400px;height:1000px"></iframe><script>
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms)),frame=document.querySelector("#appFrame"),lines=[];let passed=0;const test=(name,value)=>{lines.push(`${value?"PASS":"FAIL"} ${name}`);if(value)passed++;};frame.addEventListener("load",async()=>{const w=frame.contentWindow,d=frame.contentDocument;d.querySelector("#nameInput").value="Test commandes";d.querySelector("#loginForm").requestSubmit();await wait(2200);d.querySelector('[data-view="agents"]').click();await wait(80);[...d.querySelectorAll(".agent-card")].find(card=>card.textContent.includes("Assistant Inventaire"))?.querySelector("button").click();await wait(1250);const submit=async text=>{const input=d.querySelector("#inventoryChatInput");input.value=text;input.dispatchEvent(new w.KeyboardEvent("keydown",{key:"Enter",bubbles:true}));await wait(1250);return[...d.querySelectorAll(".inventory-chat-message.assistant")].at(-1);};let message=await submit("est ce que on a commandé du qiazol recement ?");test("1 QIAzol absent des commandes chargées",message.textContent.includes("aucune commande contenant clairement du qiazol"));message=await submit("et du luminex ?");test("2 suivi Luminex retrouve deux commandes",message.querySelectorAll(".inventory-chat-result").length===2);test("3 liens stables",[...message.querySelectorAll("[data-assistant-nav='order']")].every(button=>button.dataset.assistantId.startsWith("ord-")));message=await submit("est ce que on a commandé un luminex récement ?");test("4 question complète Luminex",message.textContent.includes("2 commandes"));message=await submit("estc eque on a commandé du endothelail cell growth medium recement ?");test("5 faute scientifique tolérée",message.querySelectorAll(".inventory-chat-result").length===2);test("6 statuts affichés",[...message.querySelectorAll(".inventory-chat-result-field")].some(row=>row.textContent.includes("Arrivée")));frame.style.width="390px";await wait(80);test("7 mobile sans débordement",d.querySelector(".inventory-chat-shell").scrollWidth<=d.querySelector(".inventory-chat-shell").clientWidth);test("8 indicateur et avatars préservés",!d.querySelector(".inventory-chat-thinking")&&d.querySelectorAll(".inventory-chat-avatar[aria-hidden='true']").length>=4);document.querySelector("#result").textContent=lines.join("\n")+`\n${passed}/8 tests passed`;document.title=passed===8?"PASS":"FAIL";document.body.dataset.failed=String(passed!==8);w.stop();});frame.src="../../index.html";
</script></body></html>
