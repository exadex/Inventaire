<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests sauvegardes GitHub</title><body><pre id="result">Tests en cours…</pre><script>
window.EXADEX_GITHUB_STORAGE={owner:"test",repo:"test",branch:"main",path:"shared_data.json",token:"token"};
const encode=value=>btoa(unescape(encodeURIComponent(JSON.stringify(value))));
const decode=value=>JSON.parse(decodeURIComponent(escape(atob(value))));
const state={version:2,inventoryItems:Array.from({length:20},(_,i)=>({id:`i${i}`})),clientSamples:Array.from({length:12},(_,i)=>({id:`s${i}`})),orders:[{id:"o1"}],experiments:[],clients:[],supplierContacts:[],history:Array.from({length:30},(_,i)=>({id:`h${i}`})),stockMovements:[],locationCatalog:{locations:[]}};
let remote=structuredClone(state),sha="shared-sha-1",sharedPuts=0;const files=new Map([
  ["backups/inventory/2026-08-10_18-15.json",{backupVersion:1,type:"inventory",createdAt:"2026-08-10T16:15:59Z",summary:{inventoryItems:20},inventoryItems:state.inventoryItems}],
  ["backups/full/2026-08-10_18-15.json",{backupVersion:1,type:"full",createdAt:"2026-08-10T16:15:59Z",summary:{inventoryItems:20,clientSamples:12},snapshot:state}]
]);
const pathFrom=url=>decodeURIComponent(new URL(url).pathname.split("/contents/")[1]||"");
window.fetch=async(url,options={})=>{const path=pathFrom(url);if(!options.method){if(path==="shared_data.json")return{ok:true,status:200,json:async()=>({sha,content:encode(remote)})};if(files.has(path))return{ok:true,status:200,json:async()=>({name:path.split("/").at(-1),path,sha:`file-${path}`,size:JSON.stringify(files.get(path)).length,type:"file",content:encode(files.get(path))})};const children=[...files.keys()].filter(key=>key.startsWith(`${path}/`)&&!key.slice(path.length+1).includes("/")).map(key=>({name:key.split("/").at(-1),path:key,sha:`file-${key}`,size:JSON.stringify(files.get(key)).length,type:"file"}));return children.length?{ok:true,status:200,json:async()=>children}:{ok:false,status:404,json:async()=>({})};}if(options.method==="DELETE"){files.delete(path);return{ok:true,status:200,json:async()=>({})}}const body=JSON.parse(options.body),data=decode(body.content);if(path==="shared_data.json"){remote=data;sha=`shared-sha-${++sharedPuts+1}`;return{ok:true,status:200,json:async()=>({content:{sha}})}}files.set(path,data);return{ok:true,status:201,json:async()=>({content:{sha:`backup-${files.size}`}})}};
</script><script src="../../js/storage/github_storage.js"></script><script>
(async()=>{const lines=[];let passed=0;const assert=(value,message)=>{if(!value)throw new Error(message)};const test=async(name,fn)=>{try{await fn();lines.push(`PASS ${name}`);passed++}catch(error){lines.push(`FAIL ${name}: ${error.message}`)}};
await test("copias semanales y mensuales visibles",async()=>{const list=await ExadexGithubStorage.listBackups(),weekly=await ExadexGithubStorage.loadBackup(list.find(x=>x.folder==="inventory").path);assert(list.length===2,"lista incompleta");assert(weekly.inventoryItems.length===20&&!weekly.snapshot&&!weekly.clientSamples,"la copia semanal contiene datos ajenos")});
await test("copia completa recuperable",async()=>{const list=await ExadexGithubStorage.listBackups(),full=list.find(x=>x.folder==="full"),backup=await ExadexGithubStorage.loadBackup(full.path);assert(backup.snapshot.clientSamples.length===12&&backup.snapshot.inventoryItems.length===20,"contenido completo ausente")});
await test("punto previo a restauración",async()=>{await ExadexGithubStorage.createNamedFullBackup(state,"Caroline","pre-restore");assert([...files.keys()].some(path=>path.startsWith("backups/restore-points/")),"punto de retorno ausente")});
await test("pérdida masiva bloqueada",async()=>{let blocked=false;try{await ExadexGithubStorage.saveSharedData({...state,clientSamples:[]},sha,{skipScheduledBackups:true})}catch(error){blocked=error.code==="CATASTROPHIC_DATA_LOSS"}assert(blocked,"guardado peligroso aceptado")});
await test("restauración autorizada",async()=>{const restored={...state,clientSamples:[]};await ExadexGithubStorage.saveSharedData(restored,sha,{allowCatastrophic:true,skipScheduledBackups:true});assert(remote.clientSamples.length===0,"restauración no aplicada")});
await test("eliminación de copia",async()=>{const list=await ExadexGithubStorage.listBackups(),target=list.find(x=>x.folder==="inventory");await ExadexGithubStorage.deleteBackup(target.path);assert(!files.has(target.path),"copia no eliminada")});
document.querySelector("#result").textContent=lines.join("\n")+`\n${passed}/6 tests passed`;document.body.dataset.failed=String(passed!==6);document.title=passed===6?"PASS":"FAIL"})();
</script></body></html>
