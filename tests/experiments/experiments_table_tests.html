<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests liste expériences</title><body><pre id="result">Tests en cours…</pre><iframe id="appFrame" hidden></iframe><script>
const out=[],assert=(v,m)=>{if(!v)throw Error(m)},test=(n,f)=>{try{f();out.push(`✓ ${n}`)}catch(e){out.push(`✗ ${n}: ${e.message}`)}};
document.querySelector("#appFrame").addEventListener("load",()=>{const app=document.querySelector("#appFrame").contentWindow,d=app.document,beforeData=JSON.stringify({items:app.items,experiments:app.applicationExperiments,clients:app.clients,clientSamples:app.clientSamples}),now="2026-08-21T10:00:00.000Z",draft={id:"fixture-draft",name:"Extraction ARN — J0",templateName:"Extraction d’ARN",status:"draft",createdAt:"2026-08-15T10:00:00.000Z",statusChangedAt:"2026-08-15T10:00:00.000Z",items:[]};
test("01 titre",()=>assert(d.querySelector("#experimentsView h3").textContent==="Expériences","titre"));test("02 ancien titre absent de la vue",()=>assert(!d.querySelector("#experimentsView").textContent.includes("Inventaire du laboratoire"),"titre inventaire"));test("03 métriques inventaire absentes",()=>assert(!d.querySelector("#experimentsView .metrics"),"métriques"));test("04 bouton création",()=>assert(d.querySelector("#addExperimentBtn").textContent==="Nouvelle expérience","bouton"));test("05 aucun historique",()=>assert(!d.querySelector("#experimentsView").textContent.includes("Historique"),"historique"));test("06 recherche partagée",()=>assert(d.querySelector("#experimentsView .client-study-controls.orders-controls"),"design"));
const fixtureClients=[{id:"fixture-client",canonicalCode:"ASH001"}],fixtureSamples=[{id:"fixture-sample",clientId:"fixture-client",canonicalClientCode:"ASH001"}],linked={...draft,clientId:"fixture-client"};
test("07 recherche code",()=>assert(app.getFilteredSortedExperiments([linked],"ash 001",fixtureClients,fixtureSamples).length===1,"code"));test("08 recherche nom",()=>assert(app.getFilteredSortedExperiments([draft],"extraction arn").length===1,"nom"));test("09 recherche statut",()=>assert(app.getFilteredSortedExperiments([draft],"brouillon").length===1,"statut"));test("10 trois cartes",()=>{app.renderExperimentMetrics();assert(d.querySelectorAll("#experimentMetrics .client-kpi-card").length===3,"cartes")});test("11 un tableau",()=>assert(d.querySelectorAll("#experimentGrid table").length===1,"table"));test("12 anciennes colonnes absentes",()=>assert(!d.querySelector("#draftExperimentList,#runningExperimentList,#completedExperimentList"),"kanban"));test("13 résolveur client partagé",()=>assert(app.getExperimentClientCodes(linked,fixtureClients,fixtureSamples)[0]==="ASH001","résolveur"));test("14 aucun code",()=>assert(app.renderExperimentTableRow(draft).includes('data-label="Code client">—'),"tiret"));test("15 date brouillon",()=>assert(app.formatExperimentStatusDate(draft)==="15 août 2026","date"));test("16 note sans transition",()=>assert(app.getExperimentStatusDate({...draft,notes:"modifiée",updatedAt:now})===draft.statusChangedAt,"date changée"));test("17 transition en cours",()=>assert(app.formatExperimentStatusDate({...draft,status:"running",statusChangedAt:now})==="21 août 2026","transition"));test("18 transition terminée",()=>assert(app.formatExperimentStatusDate({...draft,status:"completed",statusChangedAt:"2026-08-28T10:00:00.000Z"})==="28 août 2026","transition"));test("19 ancienne date non inventée",()=>assert(app.formatExperimentStatusDate({status:"running",updatedAt:now})==="—","fallback"));test("20 badge statut",()=>assert(app.renderExperimentTableRow(draft).includes("Brouillon"),"badge"));
const stock={id:"fixture-stock",name:"Fixture",quantity:10,unit:"mL"},tracked={...stock,id:"tracked",quantity:0,stockTracking:{mode:"containers",packagingLevels:[{key:"mL",singular:"mL",plural:"mL",kind:"continuous",contains:1}],trackingUnitKey:"mL",closedByLocation:[],openContainers:[{id:"done",remaining:50,capacity:50,status:"finished"}]}},fixtureItems=[stock,tracked],base={...draft,items:[{type:"inventory",inventoryItemId:"fixture-stock",quantity:5,unit:"mL"}]};test("21 suffisant",()=>assert(app.getExperimentAvailabilityCounts(base,fixtureItems).sufficient===1,"suffisant"));test("22 insuffisant",()=>assert(app.getExperimentAvailabilityCounts({...base,items:[{...base.items[0],quantity:20}]},fixtureItems).insufficient===1,"insuffisant"));test("23 stock nul",()=>assert(app.getExperimentAvailabilityCounts(base,[{...stock,quantity:0}]).insufficient===1,"nul"));test("24 libre exclu",()=>assert(app.getExperimentAvailabilityCounts({...base,items:[{type:"custom",name:"Libre",quantity:99,unit:"mL"}]},fixtureItems).sufficient===0,"libre"));test("25 conversion impossible exclue",()=>assert(app.getExperimentAvailabilityCounts({...base,items:[{...base.items[0],unit:"kg"}]},fixtureItems).insufficient===0,"conversion"));test("26 terminé exclu",()=>assert(app.getExperimentAvailabilityCounts({...base,items:[{type:"inventory",inventoryItemId:"tracked",quantity:1,unit:"mL"}]},fixtureItems).insufficient===1,"terminé"));test("27 recalcul stock actuel",()=>assert(app.getExperimentAvailabilityCounts(base,[{...stock,quantity:2}]).insufficient===1,"recalcul"));test("28 une ligne",()=>assert((app.renderExperimentTableRow(draft).match(/<tr/g)||[]).length===1,"ligne"));test("29 tri sans mutation",()=>{const source=[{...draft,name:"B"},{...draft,id:"a",name:"A"}],snapshot=JSON.stringify(source);app.getFilteredSortedExperiments(source);assert(JSON.stringify(source)===snapshot,"mutation")});test("30 état vide unique",()=>{const input=d.querySelector("#experimentSearchInput"),previous=input.value;input.value="aucun-resultat-fixture";app.renderExperiments();assert(d.querySelectorAll("#experimentTableBody .empty-table-cell").length===1,"vide");input.value=previous});test("31 desktop colonnes",()=>assert(d.querySelectorAll(".experiments-list-table th").length===6,"colonnes"));test("32 mobile labels",()=>assert(app.renderExperimentTableRow(draft).includes('data-label="Date du statut"'),"labels"));const sortA={...draft,id:"s-a",name:"Alpha",status:"completed"},sortB={...draft,id:"s-b",name:"Beta",status:"draft"},sortSet=[sortA,sortB],sortNames=(list,mode)=>app.getFilteredSortedExperiments(list,"",fixtureClients,fixtureSamples,mode).map(experiment=>experiment.name).join();test("34 tri A-Z",()=>assert(sortNames(sortSet,"az")==="Alpha,Beta","az"));test("35 tri Z-A",()=>assert(sortNames(sortSet,"za")==="Beta,Alpha","za"));test("36 tri statut",()=>assert(sortNames(sortSet,"status")==="Beta,Alpha","statut"));test("37 tri code client",()=>assert(sortNames([sortA,{...sortB,clientId:"fixture-client"}],"client")==="Beta,Alpha","code client"));test("38 tri par défaut A-Z",()=>assert(app.getFilteredSortedExperiments(sortSet).map(experiment=>experiment.name).join()==="Alpha,Beta","défaut"));test("39 sélecteur de tri partagé",()=>{const select=d.querySelector("#experimentsView #experimentSortSelect");assert(select&&select.closest(".order-control-field"),"composant partagé");assert([...select.options].map(option=>option.value).join()==="az,za,client,status","options")});test("33 données réelles intactes",()=>assert(JSON.stringify({items:app.items,experiments:app.applicationExperiments,clients:app.clients,clientSamples:app.clientSamples})===beforeData,"données modifiées"));document.querySelector("#result").textContent=out.join("\n");document.title=out.some(x=>x.startsWith("✗"))?"FAIL":"PASS"});document.querySelector("#appFrame").src="../../index.html";
</script></body></html>
