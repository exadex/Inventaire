<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests fin automatique des contenants</title><link rel="stylesheet" href="../../assets/css/design.css"><body><pre id="result">Tests en cours…</pre><main id="fixture"></main><iframe id="appFrame" hidden></iframe><script>

const source=item([container("1",50)]),result=S.apply(source,operation("1"),user),finished=result.item.stockTracking.openContainers.find(row=>row.id==="1"),event=result.events[0];test("01 ouvert 50 vers 0 terminé",()=>assert(finished.remaining===0&&finished.status==="finished","transition absente"));test("02 absent des ouverts actifs",()=>assert(!S.normalizeTracking(result.item).openContainers.some(row=>row.status==="open"),"encore actif"));test("03 exclu du disponible",()=>assert(S.available(result.item)===0,String(S.available(result.item))));test("04 objet conservé",()=>assert(result.item.stockTracking.openContainers.some(row=>row.id==="1"),"objet supprimé"));test("05 mouvement unique complet",()=>assert(result.events.length===1&&event.beforeQuantity===50&&event.afterQuantity===0&&event.containerStatusBefore==="open"&&event.containerStatusAfter==="finished","mouvement incomplet"));test("06 utilisateur conservé",()=>assert(event.userName==="Caroline","utilisateur"));test("07 date conservée",()=>assert(Number.isFinite(Date.parse(event.timestamp)),"date"));test("08 motif conservé",()=>assert(event.comment==="Utilisation pour l’étude ASH001","motif"));test("09 aucun second mouvement",()=>assert(result.events.length===1,"doublon"));const htmlBefore=app.renderAdvancedStockDetail(result.item),htmlAfter=app.renderAdvancedStockDetail(result.item);test("10 rerender sans mouvement",()=>assert(htmlBefore===htmlAfter,"rerender instable"));const normalized=S.normalizeTracking(result.item);test("11 rechargement sans transition",()=>assert(normalized.openContainers.find(row=>row.id==="1").status==="finished","réactivé"));test("12 synchronisation idempotente",()=>{const repaired=S.repairZeroRemainingContainers(result.item,result.events);assert(!repaired.changed&&!repaired.events.length,"sync dupliquée")});test("13 déjà terminé sans action",()=>assert(!S.repairZeroRemainingContainers(item([container("done",0,"finished")]),[]).changed,"action créée"));const negative=S.repairZeroRemainingContainers(item([container("neg",-1e-8)]),[]);test("14 négatif normalisé",()=>assert(negative.item.stockTracking.openContainers[0].remaining===0&&negative.item.stockTracking.openContainers[0].status==="finished","négatif"));const near=S.repairZeroRemainingContainers(item([container("near",5e-7)]),[]);test("15 tolérance zéro",()=>assert(near.changed,"tolérance"));const positive=S.repairZeroRemainingContainers(item([container("positive",2e-6)]),[]);test("16 positif actif",()=>assert(!positive.changed,"positif terminé"));test("17 null distinct de zéro",()=>assert(!S.repairZeroRemainingContainers(item([container("null",null)]),[]).changed,"null terminé"));const missing=container("missing",10);delete missing.remaining;test("18 propriété absente distincte",()=>assert(!S.repairZeroRemainingContainers(item([missing]),[]).changed,"absent terminé"));test("19 NaN distinct de zéro",()=>assert(!S.repairZeroRemainingContainers(item([container("nan",Number.NaN)]),[]).changed,"NaN terminé"));const closedZero=container("closed-zero",0,"closed",{label:"bouteille fermée nº1"}),closedRepair=S.repairZeroRemainingContainers(item([], [closedZero]),[]);test("20 fermé individuel terminé",()=>assert(closedRepair.item.stockTracking.closedContainers[0].status==="finished","fermé actif"));test("21 compteur global intact",()=>{const global=item([],[],44),repair=S.repairZeroRemainingContainers(global,[]);assert(!repair.changed&&S.summary(global).includes("44 fermés"),S.summary(global))});test("22 aucune seconde réduction",()=>assert(S.available(result.item)===0,"double réduction"));test("23 compteur ouverts recalculé",()=>assert(!S.summary(result.item).includes("ouvert"),S.summary(result.item)));test("24 compteur fermés recalculé",()=>assert(!S.summary(closedRepair.item).includes("fermé"),S.summary(closedRepair.item)));const withStock=item([container("zero",0)],[],44);withStock.aliquotTracking.preparations=[{id:"p",createdCount:36,representedSourceQuantity:18000,locations:[{location:"Réserve",quantity:36}],openAliquots:[],status:"active"}];const visualRepair=S.repairZeroRemainingContainers(withStock,[]),total=S.available(visualRepair.item);test("25 équivalent total correct",()=>assert(total===45,String(total)));const equivalents=S.equivalentLevels(visualRepair.item,total);test("26 conversions correctes",()=>assert(equivalents[1].value===22500&&equivalents[2].value===22500000,JSON.stringify(equivalents)));test("27 statut global cohérent",()=>assert(app.getStockStatus(visualRepair.item).status==="ok","statut"));const legacy=item([container("legacy",0)]),first=S.repairZeroRemainingContainers(legacy,[]),second=S.repairZeroRemainingContainers(first.item,first.events);test("28 ancienne entrée réparée une fois",()=>assert(first.changed&&!second.changed,"réparation répétée"));test("29 trace unique",()=>assert(first.events.length===1&&!second.events.length,"trace répétée"));test("30 fixtures uniquement",()=>assert(source!==app.items?.find?.(row=>row.id==="fbs")&&!String(S.repairZeroRemainingContainers).includes("shared_data"),"données réelles utilisées"));fixture.innerHTML=app.renderAdvancedStockDetail(visualRepair.item)+app.renderStockMovement(event);test("visuel desktop",()=>assert(!fixture.textContent.includes("1 ouvert")&&!fixture.textContent.includes("0 mL restants")&&fixture.textContent.includes("44 fermés")&&fixture.textContent.includes("Statut : Ouvert → Terminé"),fixture.textContent));fixture.style.width="320px";test("visuel mobile",()=>assert([...fixture.children].every(node=>node.scrollWidth<=node.clientWidth+1),"débordement"));document.querySelector("#result").textContent=rows.join("\n")+`\n${passed}/${rows.length} tests réussis`;document.body.dataset.failed=String(rows.some(row=>row.startsWith("✗")));document.title=rows.some(row=>row.startsWith("✗"))?"FAIL":"PASS"});document.querySelector("#appFrame").src="../../index.html";
