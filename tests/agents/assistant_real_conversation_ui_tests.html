const submit=async text=>{const input=d.querySelector("#inventoryChatInput");input.value=text;input.dispatchEvent(new w.KeyboardEvent("keydown",{key:"Enter",bubbles:true}));await wait(1250);return[...d.querySelectorAll(".inventory-chat-message.assistant p")].at(-1)?.textContent||"";};
let response=await submit("bonjour");test("1 bonjour naturel",response.startsWith("Bonjour 👋"));response=await submit("je voulais savoir si jai assez de collagen 3 pour faire une manip");test("2 Collagène III ciblé",response.includes("Anti-Collagen III")&&response.includes("épuisé"));test("3 aucun Collagène IV affiché",![...d.querySelectorAll(".inventory-chat-message.assistant:last-of-type .inventory-chat-result-name")].some(row=>row.textContent.includes("IV")));response=await submit("ok merci");test("4 remerciement naturel",response==="Avec plaisir.");response=await submit("aussi, est ce jai un contact chez rd systems?");test("5 changement vers R&D Systems",response.includes("R&D Systems")&&!response.includes("Collagen"));response=await submit("est ce que jai un contact chez thermo fisher ?");test("6 changement vers Thermo Fisher",response.includes("Thermo Fisher Scientific"));response=await submit("jai des echantillons de letude cleint ash001 ?");test("7 échantillons ASH001",response.includes("1 échantillon disponible")&&[...d.querySelectorAll(".inventory-chat-message.assistant:last-of-type .inventory-chat-result-name")].some(row=>row.textContent==="Sérum ASH001"));test("8 conversation sans fallback générique",![...d.querySelectorAll(".inventory-chat-message.assistant p")].slice(1).some(row=>row.textContent.startsWith("Je peux vous renseigner sur")));
document.querySelector("#result").textContent=lines.join("\n")+`\n${passed}/8 tests passed`;document.title=passed===8?"PASS":"FAIL";document.body.dataset.failed=String(passed!==8);w.stop();});frame.src="../../index.html";
</script></body></html>
