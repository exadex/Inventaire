<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>RUNNING</title>
<pre id="result">RUNNING</pre>
<iframe id="appFrame" src="../../index.html" style="position:absolute;left:-10000px;top:0;width:1280px;height:900px;border:0"></iframe>
<script>
(async () => {
  const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
  const frame = document.querySelector("#appFrame");
  await new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
  const doc = frame.contentDocument, win = frame.contentWindow;
  doc.querySelector("#nameInput").value = "Caroline";
  doc.querySelector("#loginForm").requestSubmit();
  await wait(3800);
  const lines = [];
  let passed = 0;
  const test = (name, condition) => { lines.push(`${condition ? "PASS" : "FAIL"} ${name}`); if (condition) passed += 1; };
  test("Enregistré absent après le simple chargement", !doc.querySelector(".shared-data-alert")?.textContent.includes("Enregistré"));
  test("Enregistré supprimé des statuts visibles", !win.renderSharedDataAlert().includes("Enregistré"));
  win.persist({ skipRemote: true });
  win.renderAlerts();
  const pending = doc.querySelector(".shared-data-alert.danger");
  test("modifications non synchronisées en rouge vif", Boolean(pending) && getComputedStyle(pending).backgroundColor === "rgb(230, 0, 0)");
  test("message non synchronisé explicite", pending?.textContent.includes("Modifications") && (pending.textContent.includes("non synchronisées") || pending.textContent.includes("cache local")));
  document.querySelector("#result").textContent = `${lines.join("\n")}\n${passed}/${lines.length} tests passed`;
  document.title = passed === lines.length ? "PASS" : "FAIL";
  document.body.dataset.failed = String(passed !== lines.length);
  win.stop();
})();
</script>
</html>
