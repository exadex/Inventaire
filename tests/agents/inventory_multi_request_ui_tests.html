<!doctype html><html lang="fr"><meta charset="utf-8"><title>Parcours UI listes inventaire</title><body><pre id="result">Tests en cours…</pre><iframe id="appFrame" style="position:absolute;left:-10000px;width:1400px;height:1000px"></iframe><script>
const wait=ms=>new Promise(r=>setTimeout(r,ms)),frame=document.querySelector('#appFrame'),lines=[];let passed=0;const test=(name,value)=>{lines.push(`${value?'PASS':'FAIL'} ${name}`);if(value)passed++;};
frame.addEventListener('load',async()=>{const w=frame.contentWindow,d=frame.contentDocument,item=(id,name,quantity,unit)=>({id,name,quantity,unit,location:'Frigo A',category:'Réactifs',references:{primary:{reference:id.toUpperCase(),supplier:''},secondary:[]},stockTracking:{mode:'simple'}}),source=w.ExadexAssistantDataSources.snapshot({items:[item('dmem','DMEM low glucose',1000,'mL'),item('tf','Human transferrin',500,'µL'),item('ins','Recombinant insulin',400,'µL')],clients:[],clientSamples:[],supplierContacts:[{id:'sup',company:'Bio Supplier',customerService:'contact@supplier.test'}],orders:[],locationCatalog:{rooms:[],locations:[],sublocations:[]},history:[],users:[]});w.ExadexAssistantDataSources.snapshot=()=>source;d.querySelector('#nameInput').value='Test';d.querySelector('#loginForm').requestSubmit();await wait(1600);d.querySelector('[data-view="agents"]').click();await wait(80);[...d.querySelectorAll('.agent-card')].find(card=>card.textContent.includes('Assistant Inventaire'))?.querySelector('button').click();await wait(900);
const submit=async text=>{const input=d.querySelector('#inventoryChatInput');input.value=text;input.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));await wait(1500);const message=[...d.querySelectorAll('.inventory-chat-message.assistant')].at(-1);return{message,text:message?.querySelector('p')?.textContent||'',cards:[...message?.querySelectorAll('.inventory-chat-result')||[]]};};
let r=await submit('jai besoin de 300mL de DMEM low glucose, de 300µL transferrin et de 174µL insuline. Estce que jai ca dans linventaire ?');test('01 conclusion trois besoins',r.text.startsWith('Oui')&&r.cards.length===3);test('02 trois liens',r.cards.every(card=>card.querySelector('[data-assistant-nav="item"]')));test('03 stocks indépendants',r.cards.map(card=>card.textContent).join('|').includes('300 µL')&&r.cards.map(card=>card.textContent).join('|').includes('174 µL'));r=await submit("jai du dmem et de l'insuline ?");test('04 deux présences',r.cards.length===2);r=await submit("jai de l'insuline ?");test('05 insuline inventaire',r.cards.length===1&&r.cards[0].textContent.includes('insulin'));r=await submit("sa fiche dans l'inventaire");test('06 sa fiche contexte',r.cards.length===1&&r.cards[0].textContent.includes('insulin'));r=await submit("montre moi la fiche de l'insuline");test('07 fiche explicite',r.text.startsWith('Voici la fiche')&&r.cards[0].querySelector('[data-assistant-nav="item"]'));
r=await submit('jai besoin de 10 mL de produit A et 200 µL de produit B');test('08 générique quantifié honnête',/manque|confirmer/i.test(r.text));r=await submit('avons-nous du produit A, du produit B et du produit C ?');test('09 générique présence honnête',/introuvable/i.test(r.text));r=await submit('montre-moi sa fiche');test('10 contexte dernier produit',/fiche|trouvé/i.test(r.text));r=await submit("quel est le contact du fournisseur de l’insuline ?");test('11 fournisseur explicite',r.message&&r.text.length>0);
frame.style.width='390px';await wait(200);r=await submit('jai besoin de 300 mL de DMEM low glucose, 300 µL de transferrin et 174 µL de insuline');const rects=r.cards.map(card=>card.getBoundingClientRect());test('12 trois cartes mobile',r.cards.length===3);test('13 aucune carte déborde',rects.every(rect=>rect.left>=0&&rect.right<=390));frame.style.width='1400px';await wait(200);test('14 desktop trois cartes',r.cards.length===3);
document.querySelector('#result').textContent=lines.join('\n')+`\n${passed}/14 tests passed`;document.title=passed===14?'PASS':'FAIL';document.body.dataset.failed=String(passed!==14);w.stop();});frame.src='../../index.html';
</script></body></html>
