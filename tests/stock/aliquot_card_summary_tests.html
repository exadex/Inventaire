<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests résumé préparation</title><body><pre id="result">Tests en cours…</pre><iframe id="appFrame" src="../../index.html" style="position:absolute;left:-10000px;width:1400px;height:900px"></iframe><script>
document.querySelector("#appFrame").addEventListener("load",()=>setTimeout(()=>{const frame=document.querySelector("#appFrame"),w=frame.contentWindow,d=frame.contentDocument,lines=[];let passed=0;const test=(name,value)=>{lines.push(`${value?"PASS":"FAIL"} ${name}`);if(value)passed++;};const prep={id:"prep-stable-2",createdCount:40,volume:10,volumeUnit:"µL",concentration:100,concentrationUnit:"µg/mL",locations:[{location:"Pièce -80°C · Tiroir nº5",quantity:40}],preparedBy:{userName:"Caroline",userEmoji:"🧪"},preparedAt:"2026-08-12T14:15:00Z",updatedAt:"2026-08-12T15:15:00Z",sourceContainerId:"source-1",note:"À utiliser pour le contrôle",openAliquots:[],status:"active"};const host=d.createElement("div");host.style.width="1200px";host.innerHTML=w.renderPreparationStockCard({aliquotTracking:{enabled:true,preparations:[prep]}},prep,"Préparation nº1");d.body.append(host);const html=host.innerHTML,metrics=host.querySelector(".preparation-key-metrics"),card=host.querySelector(".preparation-stock-card");test("quatre indicateurs conservés",metrics.children.length===4);test("indicateurs plus courts que la carte",metrics.getBoundingClientRect().width<card.getBoundingClientRect().width*.85);test("ligne Notes distincte",host.querySelector(".preparation-note")?.textContent.includes("À utiliser pour le contrôle")&&getComputedStyle(host.querySelector(".preparation-note")).fontStyle==="italic");test("résumé limité à la préparation",host.querySelector(".preparation-secondary")?.textContent.includes("Préparée par 🧪 Caroline")&&!html.includes("Contenant source")&&!html.includes("Dernière modification")&&!html.includes("non ouvertes"));test("résumé aligné à gauche",getComputedStyle(host.querySelector(".preparation-secondary")).textAlign==="left");document.querySelector("#result").textContent=lines.join("\n")+`\n${passed}/5 tests passed`;document.title=passed===5?"PASS":"FAIL";document.body.dataset.failed=String(passed!==5);w.stop();},800));
</script></body></html>
