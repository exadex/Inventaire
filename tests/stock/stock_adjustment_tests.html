<!doctype html><html lang="fr"><meta charset="utf-8"><title>RUNNING</title><pre id="result">RUNNING</pre>
<script src="../../js/stock/stock_tracking.js"></script><script>
const lines=[];let passed=0;const check=(name,fn)=>{try{fn();lines.push(`PASS ${name}`);passed++}catch(error){lines.push(`FAIL ${name}: ${error.message}`)}},ok=(value,message)=>{if(!value)throw new Error(message)},clone=value=>JSON.parse(JSON.stringify(value));
const operation=(quantity,comment="")=>({operationId:StockTracking.id("count"),type:"recounted",entityType:"item",quantity,comment});
const legacy=(quantity=0)=>({id:"legacy-bottle",name:"Ancienne bouteille",category:"Réactifs",quantity,unit:"bouteilles",minStock:1,location:"Réserve",locations:["Réserve"],tags:["test"],notes:"Métadonnée conservée",references:{primary:{supplier:"Test",reference:"REF-1"}}});
check("01 ancienne fiche normalisée en suivi simple",()=>ok(StockTracking.normalizeTracking(legacy()).mode==="simple","mode incorrect"));
check("02 comptage absolu de 0 vers 2",()=>{const result=StockTracking.apply(legacy(0),operation(2),{name:"Caroline"});ok(result.item.quantity===2,"stock incorrect");ok(result.event.type==="recounted"&&result.event.beforeQuantity===0&&result.event.afterQuantity===2&&result.event.difference===2,"trace incorrecte")});
check("03 comptage absolu de 5 vers 3",()=>{const result=StockTracking.apply(legacy(5),operation(3),{name:"Caroline"});ok(result.item.quantity===3&&result.event.difference===-2,"correction négative incorrecte")});
check("04 note facultative",()=>{const result=StockTracking.apply(legacy(1),operation(2),{name:"Caroline"});ok(result.event.comment===""&&result.item.quantity===2,"note exigée")});
check("05 aucune réception ou utilisation fictive",()=>{const up=StockTracking.apply(legacy(0),operation(2),{name:"Caroline"}).event,down=StockTracking.apply(legacy(5),operation(3),{name:"Caroline"}).event;ok(up.type==="recounted"&&down.type==="recounted","type falsifié")});
check("06 métadonnées conservées",()=>{const before=legacy(0),result=StockTracking.apply(before,operation(2),{name:"Caroline"}).item;["name","category","unit","minStock","location","notes"].forEach(key=>ok(JSON.stringify(result[key])===JSON.stringify(before[key]),`${key} perdu`));ok(result.references.primary.reference==="REF-1"&&result.tags[0]==="test","champs imbriqués perdus")});
const tracked=()=>({ ...legacy(0),stockTracking:{version:1,mode:"containers",traceabilityMode:"detailed",packagingLevels:[{id:"level-1",key:"bouteille",singular:"bouteille",plural:"bouteilles",kind:"discrete",contains:1},{id:"level-2",key:"ml",singular:"mL",plural:"mL",kind:"continuous",contains:500}],trackingUnitKey:"ml",trackingUnit:"mL",closedByLocation:[],openContainers:[]},aliquotTracking:{enabled:false,preparations:[]} });
check("07 configuration bouteille et mL conservée",()=>{const item=tracked(),result=StockTracking.apply(item,{operationId:"closed-2",type:"recounted",entityType:"closed",fromLocation:"Réserve",quantity:2},{name:"Caroline"}).item,tracking=StockTracking.normalizeTracking(result);ok(tracking.mode==="containers"&&tracking.packagingLevels[0].singular==="bouteille"&&tracking.packagingLevels[1].singular==="mL"&&tracking.trackingUnitKey==="ml","configuration perdue")});
check("08 deux bouteilles fermées sans contenu ouvert inventé",()=>{const result=StockTracking.apply(tracked(),{operationId:"closed-only",type:"recounted",entityType:"closed",fromLocation:"Réserve",quantity:2},{name:"Caroline"});const tracking=StockTracking.normalizeTracking(result.item);ok(tracking.closedContainers.length===2&&tracking.openContainers.length===0&&result.item.quantity===2,"répartition incorrecte")});
check("09 contenants ouverts préexistants inchangés",()=>{const item=tracked();item.stockTracking.openContainers=[{id:"open-1",label:"Bouteille ouverte",location:"Réserve",remaining:200,capacity:500,status:"open",version:1}];const before=clone(item.stockTracking.openContainers[0]),result=StockTracking.apply(item,{operationId:"closed-with-open",type:"recounted",entityType:"closed",fromLocation:"Réserve",quantity:2},{name:"Caroline"}),after=result.item.stockTracking.openContainers[0];["id","label","location","remaining","capacity","status","version"].forEach(key=>ok(after[key]===before[key],`${key} du contenant ouvert modifié`));ok(result.item.quantity===2.4,"stock total incorrect")});
check("10 comptages successifs utilisent la valeur la plus récente",()=>{let item=StockTracking.apply(legacy(0),operation(2),{name:"Caroline"}).item;const second=StockTracking.apply(item,operation(1),{name:"Caroline"});ok(second.event.beforeQuantity===2&&second.event.afterQuantity===1&&second.event.difference===-1,"ancien état réutilisé")});
check("11 sérialisation et rechargement conservent stock et suivi",()=>{const counted=StockTracking.apply(tracked(),{operationId:"serialize",type:"recounted",entityType:"closed",fromLocation:"Réserve",quantity:2},{name:"Caroline"}).item,reloaded=JSON.parse(JSON.stringify(counted)),tracking=StockTracking.normalizeTracking(reloaded);ok(StockTracking.available(reloaded)===2&&tracking.closedContainers.length===2&&tracking.packagingLevels[1].singular==="mL","rechargement incorrect")});
check("12 correction détaillée de 5 vers 3 bouteilles fermées",()=>{const five=StockTracking.apply(tracked(),{operationId:"closed-five",type:"recounted",entityType:"closed",fromLocation:"Réserve",quantity:5},{name:"Caroline"}).item,result=StockTracking.apply(five,{operationId:"closed-three",type:"recounted",entityType:"closed",fromLocation:"Réserve",quantity:3},{name:"Caroline"});ok(result.event.type==="recounted"&&result.event.beforeQuantity===5&&result.event.afterQuantity===3&&result.event.difference===-2,"écart détaillé incorrect");ok(StockTracking.totalClosed(StockTracking.normalizeTracking(result.item))===3,"nombre fermé incorrect")});
check("13 plusieurs contenants ouverts restent inchangés",()=>{const item=tracked();item.stockTracking.openContainers=[{id:"open-a",location:"Réserve",remaining:200,capacity:500,status:"open",version:1},{id:"open-b",location:"Laboratoire",remaining:100,capacity:500,status:"open",version:2}];const result=StockTracking.apply(item,{operationId:"closed-multiple-open",type:"recounted",entityType:"closed",fromLocation:"Réserve",quantity:2},{name:"Caroline"}),open=StockTracking.normalizeTracking(result.item).openContainers;ok(open.length===2&&open[0].remaining===200&&open[1].remaining===100&&open[0].version===1&&open[1].version===2,"contenants ouverts altérés");ok(result.item.quantity===2.6,"stock total avec ouverts incorrect")});
document.querySelector("#result").textContent=`${lines.join("\n")}\n${passed}/${lines.length} tests passed`;document.title=passed===lines.length?"PASS":"FAIL";document.body.dataset.failed=String(passed!==lines.length);
</script></html>
