<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests listes et routage inventaire</title><body><pre id="result">Tests en cours…</pre>
<script src="../../js/stock/stock_tracking.js"></script><script src="../../js/agents/scientific_variants.js"></script><script src="../../js/agents/inventory_assistant.js"></script><script src="../../js/agents/assistant_data_sources.js"></script><script src="../../js/agents/transversal_assistant.js"></script><script>
const A=ExadexInventoryAssistant,D=ExadexAssistantDataSources,lines=[];let passed=0;const test=(name,value)=>{lines.push(`${value?'PASS':'FAIL'} ${name}`);if(value)passed++;};
const item=(id,name,quantity,unit,extra={})=>({id,name,quantity,unit,location:extra.location||'Frigo',category:extra.category||'Réactifs',notes:extra.notes||'',references:{primary:{reference:extra.reference||id.toUpperCase(),supplier:extra.supplier||''},secondary:[]},stockTracking:{mode:'simple'}});
const items=[item('dmem','DMEM low glucose',1000,'mL'),item('tf','Human transferrin',500,'µL'),item('ins','Recombinant insulin',100,'µL'),item('note','Contrôle négatif',2,'tubes',{notes:'insulin transferrin'})],snapshot=D.snapshot({items,clients:[],clientSamples:[],supplierContacts:[{id:'thermo',company:'Thermo Fisher',phone:'0102030405'}],orders:[],locationCatalog:{rooms:[],locations:[],sublocations:[]},history:[],users:[]}),adapters={stockInfo:item=>({quantity:item.quantity,unit:item.unit,display:`${item.quantity} ${item.unit}`,convertible:true}),stockText:item=>`${item.quantity} ${item.unit}`,locationText:item=>item.location};
const q1="jai besoin de 300mL de DMEM low glucose, de 300µL transferrin et de 174µL insuline. Estce que jai ca dans linventaire ?",a1=A.analyzeTransversal(q1),r1=A.answer(q1,snapshot,adapters);
test('01 trois segments',a1.requests.length===3);test('02 DMEM associé',a1.requests[0].product==='DMEM low glucose'&&a1.requests[0].quantity===300&&a1.requests[0].unit==='mL');test('03 transferrine associée',/transferrin/i.test(a1.requests[1].product)&&a1.requests[1].quantity===300&&a1.requests[1].unit==='µL');test('04 insuline associée',/insuline/i.test(a1.requests[2].product)&&a1.requests[2].quantity===174&&a1.requests[2].unit==='µL');test('05 unités absentes noms',a1.requests.every(x=>!/(?:^|\s)(?:ml|µl|ul)(?:\s|$)/i.test(x.product)));test('06 intention globale',a1.intent==='check_multiple_inventory_requirements'&&a1.domain==='inventory');test('07 recherches séparées',r1.evaluations.length===3);test('08 stocks séparés',r1.evaluations.map(x=>x.row?.stockQuantity).join()==='1000,500,100');test('09 positif exige tous positifs',r1.globalStatus!=='positive');test('10 un négatif global négatif',r1.globalStatus==='insufficient');test('11 conversion inconnue partielle',A.answer(q1,snapshot,{...adapters,stockInfo:item=>item.id==='tf'?{quantity:500,unit:'tubes',display:'500 tubes',convertible:false}:adapters.stockInfo(item)}).globalStatus==='unknown');test('12 liens stables',r1.results.every(x=>x.navigation.id===x.id));
const q2="jai du dmem et de l'insuline ?",a2=A.analyzeTransversal(q2),r2=A.answer(q2,snapshot,adapters);test('13 deux produits',a2.presenceProducts.length===2);test('14 deux recherchés',r2.results.some(x=>x.id==='dmem')&&r2.results.some(x=>x.id==='ins'));test('15 DMEM ne masque pas insuline',r2.results.length===2);test('16 pas contact',a2.domain==='inventory');test('17 affichage séparé',r2.results.every(x=>x.navigation));
const a3=A.analyzeTransversal("jai de l'insuline ?");test('18 insuline inventaire',a3.domain==='inventory');test('19 combien stock',A.analyzeTransversal("combien d’insuline avons-nous ?").domain==='inventory');test('20 localisation',A.analyzeTransversal("où est l’insuline ?").domain==='inventory');test('21 fournisseur explicite',A.analyzeTransversal("contact du fournisseur de l’insuline").domain==='suppliers');test('22 absent pas contact',A.analyzeTransversal("jai de la substance inconnue ?").domain==='inventory');test('23 variante insulin',A.answer("jai de l'insuline ?",snapshot,adapters).results[0]?.id==='ins');test('24 nom avant notes',A.answer("jai de l'insuline ?",snapshot,adapters).results[0]?.id==='ins');
const card=A.analyzeTransversal("montre moi la fiche de l'insuline");test('25 intention fiche',card.intent==='open_or_show_inventory_item');const first=A.answer("jai de l'insuline ?",snapshot,adapters),follow=A.answer("sa fiche dans l'inventaire",snapshot,adapters,{context:first.context});test('26 contexte fiche',follow.results[0]?.id==='ins');test('27 route stable',A.answer("ouvre la fiche de l’insuline",snapshot,adapters).results[0]?.navigation.id==='ins');test('28 fiche contact reste fournisseur',A.analyzeTransversal("fiche contact Thermo Fisher").domain==='suppliers');test('29 fiche étude reste étude',A.analyzeTransversal("fiche de l’étude ASH001").domain==='studies');const ambiguousSnapshot=D.snapshot({items:[...items,item('ins2','Insulin human',3,'µL')],clients:[],clientSamples:[],supplierContacts:[],orders:[]});test('30 ambigu non arbitraire',A.answer("fiche de l’insuline",ambiguousSnapshot,adapters).results.length===2);test('31 aucune fiche honnête',A.answer("fiche de la substance inconnue",snapshot,adapters).results.length===0);
test('32 entité conservée',first.context.lastMentionedEntity==='insuline');test('33 sa fiche reprend',follow.analysis.cardTarget==='insuline');test('34 inventaire remplace domaine',A.analyzeTransversal("sa fiche dans l'inventaire",{lastMentionedEntity:'insuline',lastDomain:'suppliers'}).domain==='inventory');const changed=A.answer("jai du dmem ?",snapshot,adapters,{context:first.context});test('35 nouveau référent',changed.context.lastMentionedEntity==='dmem');test('36 référent ambigu',A.answer("sa fiche dans l'inventaire",snapshot,adapters).kind==='clarify');
const before=JSON.stringify(items);A.answer(q1,snapshot,adapters);test('37 recherche immuable',before===JSON.stringify(items));A.answer("ouvre la fiche de l’insuline",snapshot,adapters);test('38 fiche immuable',before===JSON.stringify(items));test('39 aucun shared_data',!String(A.answer).includes('shared_data.json'));test('40 fixtures isolées',snapshot.inventory.every(x=>items.includes(x.source)));
const diagnostics=[q1,q2,"jai de l'insuline ?","sa fiche dans l'inventaire","montre moi la fiche de l'insuline"].map((q,i)=>A.analyzeTransversal(q,i===3?first.context:{}));console.debug('Assistant diagnostics',diagnostics);document.querySelector('#result').textContent=lines.join('\n')+`\n${passed}/40 tests passed\n\nDIAGNOSTICS\n`+JSON.stringify(diagnostics,null,2);document.title=passed===40?'PASS':'FAIL';document.body.dataset.failed=String(passed!==40);
</script></body></html>
