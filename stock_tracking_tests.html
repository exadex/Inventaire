<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests StockTracking</title><body><pre id="result">Tests en cours…</pre><script src="stock_tracking.js"></script><script>
const results=[]; const test=(name,fn)=>{try{fn();results.push(`✓ ${name}`)}catch(error){results.push(`✗ ${name}: ${error.message}`)}}; const assert=(condition,message)=>{if(!condition)throw new Error(message)};
const base={id:"test",name:"Test",quantity:3,minStock:2,unit:"cartons",stockTracking:{mode:"containers",traceabilityMode:"detailed",packagingLevels:[{singular:"carton",plural:"cartons",contains:1},{singular:"sachet",plural:"sachets",contains:10},{singular:"flacon",plural:"flacons",contains:50}],quantityStep:1,precision:0,closedByLocation:[{location:"Réserve",quantity:3}],openContainers:[]},aliquotTracking:{enabled:true,preparations:[]}};
const op=(type,extra={})=>({operationId:StockTracking.id("op"),type,...extra}); let state=base;
test("normalisation Cartons / SACHETS / tubes",()=>{const carton=StockTracking.normalizeUnitLabel("Cartons"),sachet=StockTracking.normalizeUnitLabel("SACHETS"),tube=StockTracking.normalizeUnitLabel("tubes");assert(carton.singular==="carton"&&carton.plural==="cartons","carton/cartons");assert(sachet.singular==="sachet"&&sachet.plural==="sachets","sachet/sachets");assert(tube.singular==="tube"&&tube.plural==="tubes","tube/tubes")});
test("mL invariant et continu",()=>{const unit=StockTracking.normalizeUnitLabel("mL");assert(unit.singular==="mL"&&unit.plural==="mL","mL invariant");assert(unit.kind==="continuous","mL continu");assert(StockTracking.validateUnitQuantity("0,5",unit)===.5,"virgule acceptée")});
test("demi-sachet refusé",()=>{let refused=false;try{StockTracking.validateUnitQuantity("0,5",StockTracking.normalizeUnitLabel("sachet"))}catch{refused=true}assert(refused,"0,5 sachet doit être refusé")});
test("configuration exacte et unité stable",()=>{const tracking=StockTracking.normalizeTracking({stockTracking:{mode:"containers",packagingLevels:[{singular:"carton",plural:"cartons",contains:1},{singular:"sachet",plural:"sachets",contains:12},{singular:"tube",plural:"tubes",contains:25}],trackingUnitKey:"sachet"}}),preview=StockTracking.packagingPreview(tracking.packagingLevels,"sachet"),migrated=5+6/StockTracking.trackingCapacity(tracking);assert(tracking.trackingUnitKey==="sachet","clé sachet");assert(StockTracking.capacity(tracking)===300,"300 tubes");assert(StockTracking.trackingCapacity(tracking)===12,"12 sachets");assert(StockTracking.toBaseQuantity(6,tracking)===150,"6 sachets = 150 tubes");assert(migrated===5.5,"migration 5,5");assert(migrated-5.5===0,"différence 0");assert(preview.equation==="1 carton = 12 sachets = 300 tubes",preview.equation);assert(preview.sentence==="Les cartons ouverts seront comptés en sachets entiers.",preview.sentence)});
test("aperçu incomplet masqué",()=>assert(StockTracking.packagingPreview([{singular:"unité",plural:"unités"}],"")===null,"aucun aperçu partiel"));
test("migration affichée avec 8 sachets synchronisés",()=>{const tracking=StockTracking.normalizeTracking({stockTracking:{mode:"containers",packagingLevels:[{singular:"carton",plural:"cartons",contains:1},{singular:"sachet",plural:"sachets",contains:12},{singular:"tube",plural:"tubes",contains:25}],trackingUnitKey:"sachet"}}),view=StockTracking.migrationPresentation(5.5,5,[8],tracking);assert(view.physicalSummary==="5 cartons fermés + 1 ouvert avec 8 sachets sur 12",view.physicalSummary);assert(view.equivalentText==="5,67 cartons",view.equivalentText);assert(view.oldText==="5,5 cartons",view.oldText);assert(view.correctionText==="+2 sachets",view.correctionText);assert(view.secondaryText==="soit +0,17 carton",view.secondaryText);assert(view.helpTexts[0]==="8 sachets sur 12",view.helpTexts[0]);assert(Math.abs(view.newEquivalent-(5+8/12))<1e-12,"précision interne")});
test("migration avec 6 sachets sans différence",()=>{const tracking=StockTracking.normalizeTracking({stockTracking:{mode:"containers",packagingLevels:[{singular:"carton",plural:"cartons",contains:1},{singular:"sachet",plural:"sachets",contains:12},{singular:"tube",plural:"tubes",contains:25}],trackingUnitKey:"sachet"}}),view=StockTracking.migrationPresentation(5.5,5,[6],tracking);assert(view.equivalentText==="5,5 cartons",view.equivalentText);assert(view.correctionText==="Aucune différence",view.correctionText);assert(view.secondaryText==="","aucun texte secondaire");assert(view.helpTexts[0]==="6 sachets sur 12",view.helpTexts[0])});
test("formes normalisées des quatre contenants",()=>{[["carton","carton","cartons"],["bouteilles","bouteille","bouteilles"],["Boîtes","boîte","boîtes"],["FLACONS","flacon","flacons"]].forEach(([input,singular,plural])=>{const unit=StockTracking.normalizeUnitLabel(input);assert(unit.singular===singular&&unit.plural===plural,`${input}: ${unit.singular}/${unit.plural}`)})});
test("trois unités ouvertes restent indépendantes",()=>{const tracking=StockTracking.normalizeTracking({stockTracking:{mode:"containers",packagingLevels:[{singular:"carton",plural:"cartons",contains:1},{singular:"sachet",plural:"sachets",contains:12}],trackingUnitKey:"sachet"}}),view=StockTracking.migrationPresentation(6.5,5,[2,3,4],tracking);assert(view.helpTexts.join("|")==="2 sachets sur 12|3 sachets sur 12|4 sachets sur 12",view.helpTexts.join("|"));assert(view.newEquivalent===5.75,"équivalent trois unités")});
test("capacité multiniveau",()=>assert(StockTracking.capacity(StockTracking.normalizeTracking(state))===500,"500 attendu"));
test("ouverture atomique",()=>{const out=StockTracking.apply(state,op("container_opened",{fromLocation:"Réserve"}),{name:"Caroline",emoji:"🧪"});state=out.item;assert(state.stockTracking.closedByLocation[0].quantity===2,"2 fermés");assert(state.stockTracking.openContainers[0].remaining===500,"500 flacons")});
test("comptage de 8 sachets équivalent 2,8 cartons",()=>{const c=state.stockTracking.openContainers[0];const out=StockTracking.apply(state,op("recounted",{entityType:"container",entityId:c.id,quantity:400,expectedVersion:c.version}),{name:"Caroline"});state=out.item;assert(StockTracking.available(state)===2.8,`reçu ${StockTracking.available(state)}`)});
test("surconsommation refusée",()=>{let refused=false;try{StockTracking.apply(state,op("consumed",{entityType:"container",entityId:state.stockTracking.openContainers[0].id,quantity:401}),{name:"Caroline"})}catch{refused=true}assert(refused,"devait être refusée")});
test("préparation et équivalence aliquotes",()=>{const c=state.stockTracking.openContainers[0];let out=StockTracking.apply(state,op("aliquots_prepared",{sourceType:"container",sourceId:c.id,sourceQuantity:5,representedSourceQuantity:5,createdCount:20,sourceUnit:"flacons",locations:[{location:"-80",quantity:12},{location:"L2",quantity:8}],volume:50,volumeUnit:"µL",concentration:.5,concentrationUnit:"mM"}),{name:"Caroline"});state=out.item;const prep=state.aliquotTracking.preparations[0];out=StockTracking.apply(state,op("aliquots_consumed",{entityId:prep.id,fromLocation:"L2",quantity:4}),{name:"Caroline"});state=out.item;assert(StockTracking.remainingAliquots(state.aliquotTracking.preparations[0])===16,"16 restantes");assert(StockTracking.aliquotEquivalent(state.aliquotTracking.preparations[0])===4,"équivalence 4")});
test("préparation depuis 1,5 g de stock global",()=>{const simple={id:"tgfb1",name:"Human TGFb1 recombinant protein peprotech",quantity:1.5,unit:"g",location:"−20 °C gris labo",locations:["−20 °C gris labo"],stockTracking:{mode:"simple"},aliquotTracking:{enabled:true,preparations:[]}};const out=StockTracking.apply(simple,op("aliquots_prepared",{sourceType:"simple",sourceQuantity:"0,5",representedSourceQuantity:.5,createdCount:20,sourceUnit:"g",locations:[{location:"−20 °C gris labo",quantity:20}],volume:50,volumeUnit:"µL",concentration:.5,concentrationUnit:"mM"}),{name:"Caroline"}),prep=out.item.aliquotTracking.preparations[0];assert(StockTracking.simpleRawAvailable(out.item)===1,"stock brut 1 g");assert(StockTracking.remainingAliquots(prep)===20,"20 aliquotes");assert(StockTracking.aliquotEquivalent(prep)===.5,"équivalence 0,5 g");assert(StockTracking.available(out.item)===1.5,"total 1,5 g");assert(out.event.type==="aliquots_prepared","événement absent")});
test("surconsommation du stock global refusée",()=>{const simple={id:"simple-limit",quantity:1.5,unit:"g",stockTracking:{mode:"simple"},aliquotTracking:{enabled:true,preparations:[]}};let refused=false;try{StockTracking.apply(simple,op("aliquots_prepared",{sourceType:"simple",sourceQuantity:1.6,representedSourceQuantity:1.6,createdCount:1,locations:[{location:"L1",quantity:1}]}),{name:"Caroline"})}catch(error){refused=/dépasse/.test(error.message)}assert(refused,"1,6 g devait être refusé")});
test("cycle complet des aliquotes ouvertes",()=>{let item={id:"open-cycle",quantity:1.5,unit:"mg",location:"Bureau",locations:["Bureau"],stockTracking:{mode:"simple"},aliquotTracking:{enabled:true,preparations:[]}};let out=StockTracking.apply(item,op("aliquots_prepared",{sourceType:"simple",sourceQuantity:.5,representedSourceQuantity:.5,createdCount:20,sourceUnit:"mg",locations:[{location:"Bureau",quantity:20}],volume:50,volumeUnit:"µL",concentration:.5,concentrationUnit:"mM"}),{name:"Caroline",emoji:"🧪"});item=out.item;let prep=item.aliquotTracking.preparations[0];out=StockTracking.apply(item,op("aliquots_consumed",{entityId:prep.id,fromLocation:"Bureau",quantity:2,expectedVersion:prep.version}),{name:"Caroline",emoji:"🧪"});item=out.item;prep=item.aliquotTracking.preparations[0];assert(StockTracking.remainingAliquots(prep)===18,"18 après consommation");out=StockTracking.apply(item,op("aliquot_opened",{entityId:prep.id,fromLocation:"Bureau",toLocation:"Bureau",expectedVersion:prep.version}),{name:"Caroline",emoji:"🧪"});item=out.item;prep=item.aliquotTracking.preparations[0];let open=prep.openAliquots[0];assert(StockTracking.remainingAliquots(prep)===17&&open.remainingVolume===50,"ouverture 17 + 50 µL");assert(StockTracking.available(item)===1.45,"ouverture sans changement total");out=StockTracking.apply(item,op("open_aliquot_consumed",{entityId:open.id,quantity:30,expectedVersion:open.version}),{name:"Caroline",emoji:"🧪"});item=out.item;prep=item.aliquotTracking.preparations[0];open=prep.openAliquots[0];assert(open.remainingVolume===20&&open.sourceEquivalentRemaining===.01,"30 µL utilisés");out=StockTracking.apply(item,op("open_aliquot_consumed",{entityId:open.id,quantity:20,expectedVersion:open.version}),{name:"Caroline",emoji:"🧪"});item=out.item;prep=item.aliquotTracking.preparations[0];assert(prep.openAliquots[0].status==="finished","aliquote terminée");out=StockTracking.apply(item,op("open_aliquot_consumed",{entityId:prep.id,openNew:true,fromLocation:"Bureau",quantity:15,expectedVersion:prep.version}),{name:"Caroline",emoji:"🧪"});item=out.item;prep=item.aliquotTracking.preparations[0];open=prep.openAliquots.find(row=>row.status==="open");assert(open.remainingVolume===35&&open.sourceEquivalentRemaining===.0175,"nouvelle aliquote 35 µL");assert(out.events.length===2&&out.events[0].type==="aliquot_opened"&&out.events[1].type==="open_aliquot_consumed","deux événements atomiques");out=StockTracking.apply(item,op("open_aliquot_moved",{entityId:open.id,toLocation:"Culture L2",expectedVersion:open.version}),{name:"Julien"});item=out.item;prep=item.aliquotTracking.preparations[0];open=prep.openAliquots.find(row=>row.status==="open");assert(open.location==="Culture L2"&&open.remainingVolume===35,"déplacement");out=StockTracking.apply(item,op("open_aliquot_discarded",{entityId:open.id,correctionReason:"Fin d’expérience",expectedVersion:open.version}),{name:"Caroline",emoji:"🧪"});item=out.item;open=item.aliquotTracking.preparations[0].openAliquots.find(row=>row.id===open.id);assert(open.status==="finished"&&open.sourceEquivalentRemaining===0,"reliquat jeté");assert(out.event.correctionReason==="Fin d’expérience"&&out.event.sourceEquivalentConsumed===.0175,"justification et équivalence")});
test("conflit sur la dernière aliquote",()=>{let item={id:"last",quantity:1,unit:"mg",stockTracking:{mode:"simple"},aliquotTracking:{enabled:true,preparations:[{id:"p-last",createdCount:1,representedSourceQuantity:1,sourceUnit:"mg",volume:50,volumeUnit:"µL",locations:[{location:"Bureau",quantity:1}],openAliquots:[],status:"active",version:1}]}};const operation=op("aliquots_consumed",{entityId:"p-last",fromLocation:"Bureau",quantity:1,expectedVersion:1});const first=StockTracking.apply(item,operation,{name:"Caroline"}).item;let conflict=false;try{StockTracking.apply(first,{...operation,operationId:StockTracking.id("op")},{name:"Julien"})}catch(error){conflict=/CONFLICT/.test(error.message)}assert(conflict,"double consommation non bloquée")});
test("ancienne préparation sans volume refuse le partiel",()=>{const item={id:"legacy-prep",quantity:1,unit:"mg",stockTracking:{mode:"simple"},aliquotTracking:{enabled:true,preparations:[{id:"legacy-p",createdCount:2,representedSourceQuantity:1,locations:[{location:"L1",quantity:2}],status:"active",version:1}]}};let refused=false;try{StockTracking.apply(item,op("aliquot_opened",{entityId:"legacy-p",fromLocation:"L1",expectedVersion:1}),{name:"Caroline"})}catch(error){refused=/volume individuel/.test(error.message)}assert(refused,"volume absent accepté")});
test("traçabilité détaillée du stock global",()=>{let item={id:"detailed-simple",quantity:1.5,unit:"mg",stockTracking:{mode:"simple",traceabilityMode:"detailed"},aliquotTracking:{enabled:false,preparations:[]}};let out=StockTracking.apply(item,op("consumed",{quantity:"0,1",comment:"Expérience X"}),{name:"Julien"});item=out.item;assert(item.quantity===1.4&&out.event.type==="consumed"&&out.event.userName==="Julien","consommation relative");out=StockTracking.apply(item,op("received",{quantity:.2}),{name:"Caroline",emoji:"🧪"});assert(out.item.quantity===1.6&&out.event.userEmoji==="🧪","réception relative")});
test("ancienne donnée sans suivi",()=>{const legacy={id:"legacy",quantity:2.5,unit:"cartons"};assert(StockTracking.normalizeTracking(legacy).mode==="simple","mode simple");assert(StockTracking.available(legacy)===2.5,"quantité conservée")});
test("déplacement du contenant sans changer son contenu",()=>{const c=state.stockTracking.openContainers[0],before=c.remaining;const out=StockTracking.apply(state,op("moved",{entityType:"container",entityId:c.id,toLocation:"L1",expectedVersion:c.version}),{name:"Caroline"});state=out.item;const moved=state.stockTracking.openContainers[0];assert(moved.location==="L1","localisation L1");assert(moved.remaining===before,"contenu inchangé")});
test("déplacement partiel de cinq aliquotes",()=>{const prep=state.aliquotTracking.preparations[0];const out=StockTracking.apply(state,op("aliquots_moved",{entityId:prep.id,fromLocation:"-80",toLocation:"L2",quantity:5,expectedVersion:prep.version}),{name:"Caroline"});state=out.item;const moved=state.aliquotTracking.preparations[0];assert(moved.locations.find(row=>row.location==="-80").quantity===7,"7 à -80");assert(moved.locations.find(row=>row.location==="L2").quantity===9,"9 à L2")});
test("conflit de version absolue refusé",()=>{const c=state.stockTracking.openContainers[0];let refused=false;try{StockTracking.apply(state,op("recounted",{entityType:"container",entityId:c.id,quantity:10,expectedVersion:c.version-1}),{name:"Julien"})}catch(error){refused=/CONFLICT/.test(error.message)}assert(refused,"conflit attendu")});
test("mutations successives sur deux sous-entités",()=>{let two=StockTracking.apply(state,op("container_opened",{fromLocation:"Réserve"}),{name:"Caroline"}).item;const [first,second]=two.stockTracking.openContainers.filter(row=>row.status==="open");two=StockTracking.apply(two,op("consumed",{entityType:"container",entityId:first.id,quantity:1,expectedVersion:first.version}),{name:"Caroline"}).item;two=StockTracking.apply(two,op("consumed",{entityType:"container",entityId:second.id,quantity:2,expectedVersion:second.version}),{name:"Julien"}).item;assert(two.stockTracking.openContainers.find(row=>row.id===first.id).remaining===first.remaining-1,"première mutation");assert(two.stockTracking.openContainers.find(row=>row.id===second.id).remaining===second.remaining-2,"seconde mutation")});
document.querySelector("#result").textContent=results.join("\n"); document.body.dataset.failed=String(results.some(row=>row.startsWith("✗")));
</script></body></html>
