<!doctype html><html lang="fr"><meta charset="utf-8"><title>Tests équivalences du stock</title><link rel="stylesheet" href="../../assets/css/design.css"><body><pre id="result">Tests en cours…</pre><main id="fixture"></main><iframe id="appFrame" hidden></iframe><script>
const rows=[];let passed=0;const assert=(condition,message)=>{if(!condition)throw new Error(message)},test=(name,fn)=>{try{fn();rows.push(`✓ ${name}`);passed++}catch(error){rows.push(`✗ ${name}: ${error.message}`)}};
document.querySelector("#appFrame").addEventListener("load",()=>{const app=document.querySelector("#appFrame").contentWindow,fixture=document.querySelector("#fixture"),level=(key,singular,plural,kind,contains)=>({key,singular,plural,kind,contains}),make=(levels=[level("bouteille","bouteille","bouteilles","discrete",1),level("mL","mL","mL","continuous",100)])=>{const capacity=levels.slice(1).reduce((n,row)=>n*row.contains,1);return{id:"summary",name:"Résumé",quantity:0,minStock:1,unit:"bouteilles",stockTracking:{mode:"containers",traceabilityMode:"periodic",packagingLevels:levels,trackingUnitKey:levels.at(-1).key,closedByLocation:[{location:"Réserve",quantity:7}],openContainers:[{id:"open",remaining:0,status:"finished",capacity}]},aliquotTracking:{enabled:true,preparations:[{id:"prep",createdCount:9,representedSourceQuantity:.9*capacity,locations:[{location:"Réserve",quantity:9}],openAliquots:[],status:"active"}]}}},render=item=>{fixture.innerHTML=app.renderAdvancedStockDetail(item);return fixture.querySelector(".advanced-stock-kpis")};
const base=make(),canonical=app.StockTracking.available(base),summary=render(base);test("01 total canonique 7,9",()=>assert(canonical===7.9,String(canonical)));test("02 conversion 790 mL",()=>assert(summary.textContent.includes("790 mL"),summary.textContent));test("03 jamais 7,9 mL",()=>assert(!summary.textContent.includes("7,9 mL"),summary.textContent));const three=make([...base.stockTracking.packagingLevels,level("µL","µL","µL","continuous",1000)]),threeSummary=render(three);test("04 troisième unité",()=>assert(threeSummary.textContent.includes("790 000 µL"),threeSummary.textContent));const twoSummary=render(base);test("05 aucun séparateur vide",()=>assert(!/·\s*·/.test(twoSummary.textContent),twoSummary.textContent));const unknown=make([...base.stockTracking.packagingLevels,{key:"mystère",singular:"mystère",plural:"mystères",kind:"continuous",contains:12}]);test("06 conversion inconnue non inventée",()=>assert(!render(unknown).textContent.includes("mystère"),"unité inconnue affichée"));const incompatible=make([level("bouteille","bouteille","bouteilles","discrete",1),level("mL","mL","mL","continuous",100),level("mg","mg","mg","continuous",2)]);test("07 incompatible absente",()=>assert(!render(incompatible).textContent.includes("mg"),"masse affichée"));const open=make();open.stockTracking.openContainers=[{id:"active",remaining:50,capacity:100,status:"open"},{id:"done",remaining:80,capacity:100,status:"finished"}];open.aliquotTracking.preparations=[];test("08 ouverts sans double comptage",()=>assert(app.StockTracking.available(open)===7.5,String(app.StockTracking.available(open))));test("09 aliquotes sans double comptage",()=>assert(app.StockTracking.available(base)===7.9,String(app.StockTracking.available(base))));test("10 terminés exclus",()=>assert(app.StockTracking.available(open)===7.5,"terminé inclus"));test("11 minimum absent de la ligne",()=>assert(!summary.textContent.includes("Minimum"),summary.textContent));test("12 minimum conservé ailleurs",()=>assert(app.renderInventoryDetail(base).includes("Minimum"),"minimum supprimé de la fiche"));test("13 statut sain conservé",()=>assert(summary.textContent.includes("Stock sain"),summary.textContent));test("14 autres statuts fonctionnels",()=>{const empty=make();empty.stockTracking.closedByLocation=[];empty.aliquotTracking.preparations=[];const low=make();low.minStock=0;low.stockTracking.closedByLocation=[];low.stockTracking.openContainers=[{id:"low",remaining:10,capacity:100,status:"open"}];low.aliquotTracking.preparations=[];const critical=make();critical.stockTracking.closedByLocation=[{location:"R",quantity:1}];critical.aliquotTracking.preparations=[];[[empty,"Stock épuisé"],[low,"Stock faible"],[critical,"Stock critique"]].forEach(([item,label])=>assert(app.renderAdvancedStockDetail(item).includes(label),label))});const singular=make();singular.stockTracking.closedByLocation=[{location:"R",quantity:1}];singular.aliquotTracking.preparations=[];test("15 singulier/pluriel",()=>{const text=render(singular).textContent;assert(text.includes("1 bouteille")&&!text.includes("1 bouteilles"),text)});test("16 décimales françaises",()=>assert(summary.textContent.includes("7,9 bouteilles"),summary.textContent));fixture.style.width="1200px";render(three);test("17 alignement desktop",()=>assert(getComputedStyle(fixture.querySelector(".advanced-stock-kpis")).display==="flex","pas flex"));fixture.style.width="320px";test("18 aucun débordement mobile",()=>{const row=render(three);assert(row.scrollWidth<=row.clientWidth+1,`${row.scrollWidth}/${row.clientWidth}`)});document.querySelector("#result").textContent=rows.join("\n")+`\n${passed}/18 tests réussis`;document.body.dataset.failed=String(passed!==18);document.title=passed===18?"PASS":"FAIL"});document.querySelector("#appFrame").src="../../index.html";
</script></body></html>
